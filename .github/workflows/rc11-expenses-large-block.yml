name: RC11 expenses and reimbursement large block
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-expenses-large-block.yml']
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Implement expenses and reimbursement module
        run: |
          cat > mobile-rc11/src/expenses.ts <<'EOF'
          import AsyncStorage from '@react-native-async-storage/async-storage';
          import { LocalAppointment } from './offline';

          export type ExpenseNature='planned'|'actual';
          export type ExpenseStatus='draft'|'submitted'|'approved'|'partial'|'rejected'|'reimbursed';
          export type PayerType='company'|'employee'|'advance';
          export type ExpenseReceipt={id:string;uri:string;kind:'image'|'pdf';name:string;createdAt:string};
          export type ExpenseRecord={
            id:string;companyId:string;userId:string;date:string;createdAt:string;updatedAt:string;
            nature:ExpenseNature;status:ExpenseStatus;category:string;subcategory:string;description:string;
            amount:number;currency:'BRL';paymentMethod:string;payerType:PayerType;
            tripId?:string|null;vehicleId?:string|null;customerId?:string|null;visitId?:string|null;costCenter?:string|null;
            receipts:ExpenseReceipt[];requestedAmount:number;approvedAmount?:number|null;reimbursedAmount?:number|null;nonReimbursable?:boolean;
            source:'manual'|'route'|'imported';
          };
          export type ExpenseCategory={code:string;label:string;subs:string[];requiresVehicle?:boolean};
          export const EXPENSE_CATEGORIES:ExpenseCategory[]=[
            {code:'fuel',label:'Combustível',subs:['Gasolina','Etanol','Diesel','GNV','Recarga elétrica'],requiresVehicle:true},
            {code:'toll',label:'Pedágio',subs:['Pedágio','Tag automática']},
            {code:'parking',label:'Estacionamento',subs:['Estacionamento','Zona Azul']},
            {code:'food',label:'Alimentação',subs:['Café','Almoço','Jantar','Lanche']},
            {code:'lodging',label:'Hospedagem',subs:['Hotel','Pousada','Airbnb','Taxas']},
            {code:'vehicle',label:'Veículo',subs:['Conserto emergencial','Oficina','Peças','Pneus','Óleo e lubrificantes','Lavagem'],requiresVehicle:true},
            {code:'assistance',label:'Assistência',subs:['Guincho','Socorro mecânico','Borracharia'],requiresVehicle:true},
            {code:'transport',label:'Transporte',subs:['Táxi','Aplicativo','Ônibus','Metrô','Passagem aérea']},
            {code:'rental',label:'Locação',subs:['Veículo','Equipamento']},
            {code:'ferry',label:'Balsa / Ferry',subs:['Balsa','Ferry','Travessia']},
            {code:'commercial',label:'Comercial',subs:['Amostras','Brindes','Material de cliente','Credenciamento']},
            {code:'travel',label:'Viagem',subs:['Bagagem','Lavanderia','Frigobar','Outras despesas de estadia']},
            {code:'other',label:'Outros',subs:['Outros']},
          ];
          export const PAYMENT_METHODS=[
            {code:'corp_card',label:'Cartão corporativo',payerType:'company' as const},{code:'corp_pix',label:'PIX da empresa',payerType:'company' as const},{code:'company_cash',label:'Dinheiro da empresa',payerType:'company' as const},
            {code:'personal_card',label:'Cartão pessoal',payerType:'employee' as const},{code:'personal_pix',label:'PIX pessoal',payerType:'employee' as const},{code:'personal_cash',label:'Dinheiro pessoal',payerType:'employee' as const},{code:'advance',label:'Adiantamento de viagem',payerType:'advance' as const},
          ];
          const key=(companyId:string)=>`movvant.rc11.expenses.${companyId||'local'}`;
          export async function readExpenses(companyId:string){const raw=await AsyncStorage.getItem(key(companyId));if(!raw)return[] as ExpenseRecord[];try{const x=JSON.parse(raw) as ExpenseRecord[];return Array.isArray(x)?x:[]}catch{return[]}}
          async function write(companyId:string,rows:ExpenseRecord[]){await AsyncStorage.setItem(key(companyId),JSON.stringify(rows.slice(0,1500)));return rows}
          export async function upsertExpense(item:ExpenseRecord){const rows=await readExpenses(item.companyId);return write(item.companyId,[item,...rows.filter(x=>x.id!==item.id)])}
          export async function removeExpense(companyId:string,id:string){return write(companyId,(await readExpenses(companyId)).filter(x=>x.id!==id))}
          export async function submitDraftExpenses(companyId:string,userId:string){const now=new Date().toISOString();const rows=(await readExpenses(companyId)).map(x=>x.userId===userId&&x.nature==='actual'&&x.status==='draft'?{...x,status:'submitted' as const,updatedAt:now}:x);return write(companyId,rows)}
          export function reimbursementFor(x:ExpenseRecord){if(x.nonReimbursable||x.payerType!=='employee')return 0;const eligible=x.status==='approved'||x.status==='partial'||x.status==='reimbursed'?Number(x.approvedAmount??x.requestedAmount??x.amount):Number(x.requestedAmount||x.amount);return Math.max(0,eligible-Number(x.reimbursedAmount||0))}
          export function summarizeExpenses(rows:ExpenseRecord[]){const planned=rows.filter(x=>x.nature==='planned').reduce((n,x)=>n+x.amount,0),actual=rows.filter(x=>x.nature==='actual').reduce((n,x)=>n+x.amount,0),reimbursement=rows.filter(x=>x.nature==='actual').reduce((n,x)=>n+reimbursementFor(x),0);return{planned,actual,variance:actual-planned,reimbursement,count:rows.length}}
          export async function ensurePlannedTripExpenses(companyId:string,userId:string,appointments:LocalAppointment[]){let rows=await readExpenses(companyId),changed=false;for(const a of appointments.filter(x=>x.type==='Viagem'&&x.travel)){const toll=Number(a.travel?.tollBRL||0);if(toll>0&&!rows.some(x=>x.id===`planned-toll-${a.id}`)){const now=new Date().toISOString();rows=[{id:`planned-toll-${a.id}`,companyId,userId,date:a.date,createdAt:now,updatedAt:now,nature:'planned',status:'draft',category:'toll',subcategory:'Pedágio',description:`Pedágio previsto · ${a.travel?.origin} → ${a.travel?.destination}`,amount:toll,currency:'BRL',paymentMethod:'corp_card',payerType:'company',tripId:a.id,receipts:[],requestedAmount:0,source:'route'},...rows];changed=true}}if(changed)await write(companyId,rows);return rows}
          EOF

          cat > mobile-rc11/src/ExpensesScreen.tsx <<'EOF'
          import React,{useEffect,useMemo,useState} from 'react';
          import * as ImagePicker from 'expo-image-picker';
          import {Alert,Modal,Pressable,SafeAreaView,ScrollView,StyleSheet,Text,TextInput,View} from 'react-native';
          import {CustomerRow,VehicleRow} from './api';
          import {LocalAppointment} from './offline';
          import {EXPENSE_CATEGORIES,PAYMENT_METHODS,ExpenseRecord,ensurePlannedTripExpenses,readExpenses,reimbursementFor,submitDraftExpenses,summarizeExpenses,upsertExpense} from './expenses';
          const NAVY='#0B3558',BLUE='#1769E0',BG='#F3F6FA',TEXT='#17324D',MUTED='#78889A',BORDER='#DFE6EE',GREEN='#22B77A',ORANGE='#F59E0B';
          const money=(v:number)=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const iso=()=>new Date().toISOString().slice(0,10);
          type Period='day'|'week'|'month'|'custom';
          export default function ExpensesScreen({companyId,userId,vehicles,customers,appointments}:{companyId?:string|null;userId:string;vehicles:VehicleRow[];customers:CustomerRow[];appointments:LocalAppointment[]}){
            const cid=companyId||'local';const [rows,setRows]=useState<ExpenseRecord[]>([]),[open,setOpen]=useState(false),[period,setPeriod]=useState<Period>('month'),[from,setFrom]=useState(iso()),[to,setTo]=useState(iso());
            const reload=async()=>setRows(await ensurePlannedTripExpenses(cid,userId,appointments));useEffect(()=>{reload()},[cid,userId,appointments.length]);
            const range=useMemo(()=>{const end=new Date();end.setHours(23,59,59,999);const start=new Date();start.setHours(0,0,0,0);if(period==='week')start.setDate(start.getDate()-6);if(period==='month')start.setDate(1);if(period==='custom'){const a=new Date(`${from}T00:00:00`),b=new Date(`${to}T23:59:59`);return[a.getTime(),b.getTime()] as const}return[start.getTime(),end.getTime()] as const},[period,from,to]);
            const visible=rows.filter(x=>{const t=new Date(`${x.date}T12:00:00`).getTime();return t>=range[0]&&t<=range[1]}),sum=summarizeExpenses(visible);
            const submit=async()=>{const drafts=rows.filter(x=>x.userId===userId&&x.nature==='actual'&&x.status==='draft').length;if(!drafts)return Alert.alert('Prestação de contas','Não há despesas em rascunho.');await submitDraftExpenses(cid,userId);await reload();Alert.alert('Prestação preparada',`${drafts} despesa(s) foram marcadas como enviadas para análise. A sincronização financeira com o backend será ativada quando as tabelas empresariais forem publicadas.`)};
            return <ScrollView contentContainerStyle={s.content}><View style={s.hero}><Text style={s.eyebrow}>DESPESAS & PRESTAÇÃO DE CONTAS</Text><Text style={s.heroTitle}>Controle financeiro da operação</Text><Text style={s.heroText}>Planejado × realizado, gastos de viagem e valores potencialmente reembolsáveis.</Text></View>
              <View style={s.tabs}>{(['day','week','month','custom'] as Period[]).map(p=><Pressable key={p} style={[s.tab,period===p&&s.tabOn]} onPress={()=>setPeriod(p)}><Text style={[s.tabText,period===p&&s.tabTextOn]}>{p==='day'?'Dia':p==='week'?'Semana':p==='month'?'Mês':'Período'}</Text></Pressable>)}</View>{period==='custom'&&<View style={s.range}><TextInput style={s.input} value={from} onChangeText={setFrom} placeholder="AAAA-MM-DD"/><Text style={s.rangeArrow}>→</Text><TextInput style={s.input} value={to} onChangeText={setTo} placeholder="AAAA-MM-DD"/></View>}
              <View style={s.grid}><Metric label="Previsto" value={money(sum.planned)}/><Metric label="Realizado" value={money(sum.actual)}/><Metric label="Diferença" value={money(sum.variance)} tone={sum.variance>0?'warn':'ok'}/><Metric label="A reembolsar" value={money(sum.reimbursement)} tone="ok"/></View>
              <Pressable style={s.primary} onPress={()=>setOpen(true)}><Text style={s.primaryText}>+ Lançar despesa</Text></Pressable><Pressable style={s.secondary} onPress={submit}><Text style={s.secondaryText}>Enviar prestação de contas</Text></Pressable>
              <Text style={s.section}>Lançamentos do período</Text>{visible.length?visible.map(x=><View key={x.id} style={s.card}><View style={{flex:1}}><Text style={s.cardTitle}>{EXPENSE_CATEGORIES.find(c=>c.code===x.category)?.label||x.category} · {x.subcategory}</Text><Text style={s.sub}>{x.date} · {x.nature==='planned'?'Previsto':'Realizado'} · {x.status}</Text>{x.description?<Text style={s.desc}>{x.description}</Text>:null}{x.tripId?<Text style={s.linked}>Viagem vinculada</Text>:null}</View><View style={{alignItems:'flex-end'}}><Text style={s.amount}>{money(x.amount)}</Text>{x.nature==='actual'&&reimbursementFor(x)>0?<Text style={s.reimb}>Reembolso {money(reimbursementFor(x))}</Text>:null}</View></View>):<View style={s.empty}><Text style={s.cardTitle}>Nenhuma despesa neste período</Text><Text style={s.sub}>Os gastos lançados e previsões automáticas aparecerão aqui.</Text></View>}
              <ExpenseModal visible={open} close={()=>setOpen(false)} companyId={cid} userId={userId} vehicles={vehicles} customers={customers} trips={appointments.filter(x=>x.type==='Viagem')} saved={async()=>{setOpen(false);await reload()}}/>
            </ScrollView>;
          }
          function Metric({label,value,tone}:{label:string;value:string;tone?:'warn'|'ok'}){return <View style={s.metric}><Text style={s.metricLabel}>{label}</Text><Text style={[s.metricValue,tone==='warn'&&{color:ORANGE},tone==='ok'&&{color:GREEN}]}>{value}</Text></View>}
          function ExpenseModal({visible,close,companyId,userId,vehicles,customers,trips,saved}:{visible:boolean;close:()=>void;companyId:string;userId:string;vehicles:VehicleRow[];customers:CustomerRow[];trips:LocalAppointment[];saved:()=>Promise<void>}){
            const [category,setCategory]=useState('fuel'),[sub,setSub]=useState('Gasolina'),[amount,setAmount]=useState(''),[payment,setPayment]=useState('personal_card'),[description,setDescription]=useState(''),[tripId,setTripId]=useState<string|undefined>(),[vehicleId,setVehicleId]=useState<string|undefined>(),[customerId,setCustomerId]=useState<string|undefined>(),[costCenter,setCostCenter]=useState(''),[receipt,setReceipt]=useState<string|undefined>();
            const cat=EXPENSE_CATEGORIES.find(x=>x.code===category)||EXPENSE_CATEGORIES[0],pm=PAYMENT_METHODS.find(x=>x.code===payment)||PAYMENT_METHODS[0];
            useEffect(()=>{setSub(cat.subs[0])},[category]);
            const pick=async()=>{const p=await ImagePicker.requestMediaLibraryPermissionsAsync();if(!p.granted)return Alert.alert('Comprovante','Permita acesso às fotos para anexar o comprovante.');const r=await ImagePicker.launchImageLibraryAsync({mediaTypes:['images'],quality:.8});if(!r.canceled)setReceipt(r.assets[0]?.uri)};
            const save=async()=>{const v=Number(amount.replace(',','.'));if(!Number.isFinite(v)||v<=0)return Alert.alert('Despesa','Informe um valor válido.');if(cat.requiresVehicle&&!vehicleId)return Alert.alert('Despesa','Esta categoria exige vínculo com um veículo.');const now=new Date().toISOString();const row:ExpenseRecord={id:`exp-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,companyId,userId,date:iso(),createdAt:now,updatedAt:now,nature:'actual',status:'draft',category,subcategory:sub,description:description.trim(),amount:v,currency:'BRL',paymentMethod:payment,payerType:pm.payerType,tripId:tripId||null,vehicleId:vehicleId||null,customerId:customerId||null,costCenter:costCenter.trim()||null,receipts:receipt?[{id:`rec-${Date.now()}`,uri:receipt,kind:'image',name:'comprovante.jpg',createdAt:now}]:[],requestedAmount:pm.payerType==='employee'?v:0,source:'manual'};await upsertExpense(row);await saved()};
            return <Modal visible={visible} animationType="slide" onRequestClose={close}><SafeAreaView style={s.modal}><View style={s.modalHead}><Text style={s.modalTitle}>Nova despesa</Text><Pressable onPress={close}><Text style={s.close}>×</Text></Pressable></View><ScrollView contentContainerStyle={s.form}><Text style={s.label}>Categoria</Text><ScrollView horizontal showsHorizontalScrollIndicator={false}>{EXPENSE_CATEGORIES.map(x=><Pressable key={x.code} style={[s.pill,category===x.code&&s.pillOn]} onPress={()=>setCategory(x.code)}><Text style={[s.pillText,category===x.code&&s.pillTextOn]}>{x.label}</Text></Pressable>)}</ScrollView><Text style={s.label}>Subcategoria</Text><View style={s.wrap}>{cat.subs.map(x=><Pressable key={x} style={[s.choice,sub===x&&s.choiceOn]} onPress={()=>setSub(x)}><Text style={s.choiceText}>{x}</Text></Pressable>)}</View><Text style={s.label}>Valor</Text><TextInput style={s.input} value={amount} onChangeText={setAmount} keyboardType="decimal-pad" placeholder="0,00"/><Text style={s.label}>Forma de pagamento</Text><View style={s.wrap}>{PAYMENT_METHODS.map(x=><Pressable key={x.code} style={[s.choice,payment===x.code&&s.choiceOn]} onPress={()=>setPayment(x.code)}><Text style={s.choiceText}>{x.label}</Text></Pressable>)}</View><Text style={s.info}>{pm.payerType==='employee'?'Pagamento pessoal: entra como potencial reembolso.':pm.payerType==='company'?'Pagamento da empresa: compõe o custo, mas não o reembolso.':'Adiantamento: será abatido da prestação.'}</Text><Text style={s.label}>Descrição</Text><TextInput style={s.input} value={description} onChangeText={setDescription} placeholder="Ex.: Pedágio BR-116"/><Text style={s.label}>Viagem vinculada</Text><View style={s.wrap}><Pressable style={[s.choice,!tripId&&s.choiceOn]} onPress={()=>setTripId(undefined)}><Text style={s.choiceText}>Sem viagem</Text></Pressable>{trips.slice(0,8).map(x=><Pressable key={x.id} style={[s.choice,tripId===x.id&&s.choiceOn]} onPress={()=>setTripId(x.id)}><Text style={s.choiceText}>{x.date} · {x.store}</Text></Pressable>)}</View><Text style={s.label}>Veículo</Text><View style={s.wrap}>{vehicles.slice(0,12).map(x=><Pressable key={x.id} style={[s.choice,vehicleId===x.id&&s.choiceOn]} onPress={()=>setVehicleId(x.id)}><Text style={s.choiceText}>{x.plate}</Text></Pressable>)}</View><Text style={s.label}>Cliente / loja</Text><View style={s.wrap}>{customers.slice(0,12).map(x=><Pressable key={x.id} style={[s.choice,customerId===x.id&&s.choiceOn]} onPress={()=>setCustomerId(x.id)}><Text style={s.choiceText}>{x.trade_name||x.legal_name}</Text></Pressable>)}</View><Text style={s.label}>Centro de custo</Text><TextInput style={s.input} value={costCenter} onChangeText={setCostCenter} placeholder="Ex.: Comercial Sul"/><Pressable style={s.receipt} onPress={pick}><Text style={s.receiptTitle}>{receipt?'✓ Comprovante anexado':'Anexar comprovante'}</Text><Text style={s.sub}>Foto neste bloco; estrutura de dados já aceita PDF.</Text></Pressable><Pressable style={s.primary} onPress={save}><Text style={s.primaryText}>Salvar despesa</Text></Pressable></ScrollView></SafeAreaView></Modal>;
          }
          const s=StyleSheet.create({content:{padding:18,paddingBottom:40,gap:14},hero:{backgroundColor:NAVY,borderRadius:22,padding:20},eyebrow:{color:'#A9C8F7',fontSize:10,fontWeight:'900',letterSpacing:2},heroTitle:{color:'#fff',fontSize:24,fontWeight:'900',marginTop:5},heroText:{color:'#D8E4F2',fontSize:12,lineHeight:18,marginTop:7},tabs:{flexDirection:'row',gap:7},tab:{flex:1,minHeight:42,borderRadius:12,borderWidth:1,borderColor:BORDER,alignItems:'center',justifyContent:'center',backgroundColor:'#fff'},tabOn:{backgroundColor:NAVY,borderColor:NAVY},tabText:{fontSize:11,fontWeight:'800',color:MUTED},tabTextOn:{color:'#fff'},range:{flexDirection:'row',alignItems:'center',gap:8},rangeArrow:{color:MUTED},grid:{flexDirection:'row',flexWrap:'wrap',gap:10},metric:{width:'48%',backgroundColor:'#fff',borderRadius:16,borderWidth:1,borderColor:BORDER,padding:14},metricLabel:{fontSize:10,color:MUTED,fontWeight:'800'},metricValue:{fontSize:18,color:TEXT,fontWeight:'900',marginTop:5},primary:{minHeight:54,borderRadius:15,backgroundColor:NAVY,alignItems:'center',justifyContent:'center'},primaryText:{color:'#fff',fontWeight:'900'},secondary:{minHeight:50,borderRadius:15,borderWidth:1,borderColor:NAVY,alignItems:'center',justifyContent:'center'},secondaryText:{color:NAVY,fontWeight:'900'},section:{fontSize:17,fontWeight:'900',color:TEXT,marginTop:3},card:{backgroundColor:'#fff',borderRadius:16,borderWidth:1,borderColor:BORDER,padding:14,flexDirection:'row',gap:10},cardTitle:{fontSize:13,fontWeight:'900',color:TEXT},sub:{fontSize:10,color:MUTED,marginTop:3},desc:{fontSize:11,color:TEXT,marginTop:5},linked:{fontSize:10,color:BLUE,fontWeight:'800',marginTop:5},amount:{fontSize:14,fontWeight:'900',color:TEXT},reimb:{fontSize:9,color:GREEN,fontWeight:'800',marginTop:4},empty:{backgroundColor:'#fff',borderRadius:16,borderWidth:1,borderColor:BORDER,padding:18},modal:{flex:1,backgroundColor:BG},modalHead:{backgroundColor:'#fff',padding:18,flexDirection:'row',alignItems:'center',justifyContent:'space-between',borderBottomWidth:1,borderBottomColor:BORDER},modalTitle:{fontSize:22,fontWeight:'900',color:TEXT},close:{fontSize:28,color:MUTED},form:{padding:18,gap:12,paddingBottom:42},label:{fontSize:11,color:MUTED,fontWeight:'900'},input:{minHeight:50,borderRadius:13,borderWidth:1,borderColor:BORDER,backgroundColor:'#fff',paddingHorizontal:13,color:TEXT,flex:1},pill:{paddingHorizontal:13,paddingVertical:10,borderRadius:999,borderWidth:1,borderColor:BORDER,backgroundColor:'#fff',marginRight:7},pillOn:{backgroundColor:NAVY,borderColor:NAVY},pillText:{fontSize:11,fontWeight:'800',color:TEXT},pillTextOn:{color:'#fff'},wrap:{flexDirection:'row',flexWrap:'wrap',gap:7},choice:{paddingHorizontal:11,paddingVertical:9,borderRadius:11,borderWidth:1,borderColor:BORDER,backgroundColor:'#fff'},choiceOn:{borderColor:NAVY,backgroundColor:'#EEF4FB'},choiceText:{fontSize:10,fontWeight:'800',color:TEXT},info:{fontSize:10,color:MUTED,lineHeight:15},receipt:{borderWidth:1,borderStyle:'dashed',borderColor:'#AAB8C8',borderRadius:14,padding:16,backgroundColor:'#fff'},receiptTitle:{fontSize:12,fontWeight:'900',color:NAVY}});
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/AppRC11Final.tsx');s=p.read_text()
          s=s.replace("import TripPlannerScreen, { PlannedTrip } from './src/TripPlannerScreen';","import TripPlannerScreen, { PlannedTrip } from './src/TripPlannerScreen';\nimport ExpensesScreen from './src/ExpensesScreen';",1)
          s=s.replace("type MorePage = 'menu' | 'lojas' | 'relatorios' | 'notificacoes' | 'sincronizacao' | 'configuracoes';","type MorePage = 'menu' | 'lojas' | 'relatorios' | 'despesas' | 'notificacoes' | 'sincronizacao' | 'configuracoes';",1)
          old="  if (page === 'relatorios') return <Reports data={data} local={local}/>;"
          new=old+"\n  if (page === 'despesas') return <ExpensesScreen companyId={data?.companyId} userId={session.user.id} vehicles={data?.vehicles || []} customers={data?.customers || []} appointments={local.appointments}/>;"
          if old not in s: raise SystemExit('more report marker missing')
          s=s.replace(old,new,1)
          old2='<Row icon="↗" title="Relatórios" sub="Indicadores reais da operação" onPress={() => setPage(\'relatorios\')}/>'
          new2=old2+'<Row icon="R$" title="Despesas & Prestação" sub="Gastos, comprovantes e reembolsos" onPress={() => setPage(\'despesas\')}/>'
          if old2 not in s: raise SystemExit('more menu marker missing')
          s=s.replace(old2,new2,1)
          old3="['↗','Relatórios',()=>go('mais','relatorios')],['↻','Sincronização'"
          new3="['↗','Relatórios',()=>go('mais','relatorios')],['R$','Despesas & Prestação',()=>go('mais','despesas')],['↻','Sincronização'"
          if old3 not in s: raise SystemExit('drawer marker missing')
          s=s.replace(old3,new3,1)
          old4="more==='relatorios'?'Relatórios':more==='notificacoes'?'Notificações'"
          new4="more==='relatorios'?'Relatórios':more==='despesas'?'Despesas & Prestação':more==='notificacoes'?'Notificações'"
          if old4 not in s: raise SystemExit('title marker missing')
          s=s.replace(old4,new4,1)
          p.write_text(s)

          p=Path('mobile-rc11/src/OperationalLayerV2.tsx');s=p.read_text()
          old="if(String(title)==='Sincronização parcial'){Promise.all([readSyncDiagnostics(),readLastSyncReport()]).then(([d,r])=>{const parts=[`Pendentes: ${d.total}`,d.visit?`visitas ${d.visit}`:'',d.km?`KM ${d.km}`:'',d.trip?`rotas ${d.trip}`:'',d.appointment?`agenda ${d.appointment}`:''].filter(Boolean).join(' · ');const issue=r?.issues?.[0]?.message?`\\n\\nMotivo: ${r.issues[0].message}`:'';setSyncNotice({title:'Sincronização parcial',message:`${parts}${issue}`})}).catch(()=>setSyncNotice({title:'Sincronização parcial',message:String(message||'Há registros aguardando envio.')}));return}"
          new="if(String(title)==='Sincronização parcial'){readSyncDiagnostics().then(d=>showNotice({tone:'warning',title:'Sincronização pendente',text:d.total===1?'1 registro permanece protegido no aparelho. Consulte Mais > Sincronização para detalhes.':`${d.total} registros permanecem protegidos no aparelho. Consulte Mais > Sincronização para detalhes.`})).catch(()=>showNotice({tone:'warning',title:'Sincronização pendente',text:'Há registros protegidos no aparelho aguardando confirmação do servidor.'}));return}"
          if old not in s: raise SystemExit('sync popup marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

