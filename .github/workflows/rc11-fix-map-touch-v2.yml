name: RC11.5 map touch v2
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-fix-map-touch-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - name: Patch repeated map route selection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/src/TripPlannerScreen.tsx')
          s=p.read_text()
          s=s.replace(
          "const routePoints=decodePolyline(route?.polyline),returnPoints=decodePolyline(route?.returnPolyline),allOutboundPoints=routes.flatMap(r=>decodePolyline(r.polyline)),mapRegion=regionFor([...allOutboundPoints,...returnPoints]);",
          "const routePoints=decodePolyline(route?.polyline),returnPoints=decodePolyline(route?.returnPolyline),allOutboundPoints=routes.flatMap(r=>decodePolyline(r.polyline)),allReturnPoints=routes.flatMap(r=>decodePolyline(r.returnPolyline)),mapRegion=regionFor([...allOutboundPoints,...allReturnPoints]);")
          s=s.replace(
          "useEffect(()=>{const pts=[...allOutboundPoints,...returnPoints];if(pts.length>1)setTimeout(()=>mapRef.current?.fitToCoordinates(pts,{edgePadding:{top:50,right:50,bottom:50,left:50},animated:true}),250)},[selected,routes.length,route?.returnPolyline]);",
          "useEffect(()=>{const pts=[...allOutboundPoints,...allReturnPoints];if(pts.length>1)setTimeout(()=>mapRef.current?.fitToCoordinates(pts,{edgePadding:{top:50,right:50,bottom:50,left:50},animated:false}),180)},[routes.length]);")
          s=s.replace(
          "const selectRoute=(i:number)=>{setSelected(i);setApprovedIndex(null);setError('')};",
          "const selectRoute=(i:number)=>{if(i<0||i>=routes.length)return;setSelected(i);setApprovedIndex(null);setShowReturn(true);setError('')};")
          s=s.replace("*0.035;if(best>=0", "*0.055;if(best>=0")
          old='''<MapView ref={mapRef} style={[s.map,{height:mapHeight}]} initialRegion={mapRegion} customMapStyle={LIGHT_MAP_STYLE} onPress={onMapPress}>{routes.map((r,i)=>{const pts=decodePolyline(r.polyline);return pts.length>1?<React.Fragment key={`alt-${i}`}><Polyline coordinates={pts} strokeColor="rgba(0,0,0,0.01)" strokeWidth={28} tappable onPress={()=>selectRoute(i)} zIndex={20}/><Polyline coordinates={pts} strokeColor={i===selected?BLUE:'#9AA9B8'} strokeWidth={i===selected?8:5} tappable onPress={()=>selectRoute(i)} zIndex={i===selected?10:2}/></React.Fragment>:null})}{showReturn&&returnPoints.length>1?<Polyline coordinates={returnPoints} strokeColor={ORANGE} strokeWidth={7} zIndex={12}/>:null}<Marker coordinate={routePoints[0]} title="Origem"/><Marker coordinate={routePoints[routePoints.length-1]} title="Destino" pinColor={ORANGE}/></MapView>'''
          new='''<MapView ref={mapRef} style={[s.map,{height:mapHeight}]} initialRegion={mapRegion} customMapStyle={LIGHT_MAP_STYLE} onPress={onMapPress}>{routes.map((r,i)=>{const pts=decodePolyline(r.polyline);return pts.length>1&&i!==selected?<Polyline key={`alt-${i}`} coordinates={pts} strokeColor="#B8C2CC" strokeWidth={4} zIndex={2}/>:null})}{routes.map((r,i)=>{const pts=decodePolyline(r.polyline);return pts.length>1?<Polyline key={`hit-${i}-${selected}`} coordinates={pts} strokeColor="rgba(0,0,0,0.01)" strokeWidth={30} tappable onPress={()=>selectRoute(i)} zIndex={30}/>:null})}{routePoints.length>1?<Polyline key={`selected-out-${selected}`} coordinates={routePoints} strokeColor={BLUE} strokeWidth={8} zIndex={18}/>:null}{showReturn&&returnPoints.length>1?<Polyline key={`selected-back-${selected}`} coordinates={returnPoints} strokeColor={ORANGE} strokeWidth={6} zIndex={17}/>:null}<Marker coordinate={routePoints[0]} title="Origem"/><Marker coordinate={routePoints[routePoints.length-1]} title="Destino" pinColor={ORANGE}/></MapView>'''
          if old not in s:
              raise SystemExit('map block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit map fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-rc11/src/TripPlannerScreen.tsx
          git commit -m 'RC11.5: fix repeated map route selection and layer order'
          git push origin HEAD:movvant-mobile-rc11
