name: RC11.6 map touch v3
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-fix-map-touch-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - name: Patch map v3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/src/TripPlannerScreen.tsx')
          s=p.read_text()
          old="[calendarOpen,setCalendarOpen]=useState(false),[calendarCursor,setCalendarCursor]=useState(new Date(initialDate+'T12:00:00')),[locating,setLocating]=useState(false);"
          new="[calendarOpen,setCalendarOpen]=useState(false),[calendarCursor,setCalendarCursor]=useState(new Date(initialDate+'T12:00:00')),[locating,setLocating]=useState(false),[stopCoords,setStopCoords]=useState<Point[]>([]);"
          if old in s: s=s.replace(old,new)
          old="const onMapPress=(e:MapPressEvent)=>{const p=e.nativeEvent.coordinate;let best=-1,bestDist=Infinity;routes.forEach((r,i)=>{const pts=decodePolyline(r.polyline);if(pts.length>1){const d=routeDistance(p,pts);if(d<bestDist){bestDist=d;best=i}}});const threshold=Math.max(mapRegion.latitudeDelta,mapRegion.longitudeDelta)*0.055;if(best>=0&&bestDist<=threshold)selectRoute(best)};"
          new="const onMapPress=(e:MapPressEvent)=>{const p=e.nativeEvent.coordinate;let best=-1,bestDist=Infinity;routes.forEach((r,i)=>{const pts=decodePolyline(r.polyline);if(pts.length>1){const d=routeDistance(p,pts);if(d<bestDist){bestDist=d;best=i}}});if(best>=0)selectRoute(best)};"
          if old not in s: raise SystemExit('onMapPress target not found')
          s=s.replace(old,new)
          old="setRoutes(items);setSelected(0);setApprovedIndex(null);setShowReturn(true);if(!items.length)setError('Nenhuma rota disponível para os pontos informados.');setTimeout(()=>scrollRef.current?.scrollToEnd({animated:true}),120)"
          new="setRoutes(items);setSelected(0);setApprovedIndex(null);setShowReturn(true);const stopTexts=stops.filter(Boolean);if(stopTexts.length){const coords=await Promise.all(stopTexts.map(async text=>{try{const g=await Location.geocodeAsync(text);return g[0]?{latitude:g[0].latitude,longitude:g[0].longitude}:null}catch{return null}}));setStopCoords(coords.filter(Boolean) as Point[])}else setStopCoords([]);if(!items.length)setError('Nenhuma rota disponível para os pontos informados.');setTimeout(()=>scrollRef.current?.scrollToEnd({animated:true}),120)"
          if old not in s: raise SystemExit('compute target not found')
          s=s.replace(old,new)
          start=s.index('<MapView ref={mapRef} style={[s.map,{height:mapHeight}]} initialRegion={mapRegion} customMapStyle={LIGHT_MAP_STYLE} onPress={onMapPress}>')
          end=s.index('</MapView>',start)+10
          current=s[start:end]
          replacement='''<MapView ref={mapRef} style={[s.map,{height:mapHeight}]} initialRegion={mapRegion} customMapStyle={LIGHT_MAP_STYLE} onPress={onMapPress}>{routes.map((r,i)=>{const pts=decodePolyline(r.polyline);return pts.length>1&&i!==selected?<Polyline key={`alt-${i}`} coordinates={pts} strokeColor="#8898A8" strokeWidth={5} zIndex={3}/>:null})}{routePoints.length>1?<Polyline key={`selected-out-${selected}`} coordinates={routePoints} strokeColor={BLUE} strokeWidth={9} zIndex={20}/>:null}{showReturn&&returnPoints.length>1?<Polyline key={`selected-back-${selected}`} coordinates={returnPoints} strokeColor={ORANGE} strokeWidth={7} zIndex={19}/>:null}<Marker coordinate={routePoints[0]} title="Origem"/>{stops.filter(Boolean).map((label,i)=>{const fallback=routePoints.length?routePoints[Math.min(routePoints.length-1,Math.max(0,Math.round(((i+1)/(stops.filter(Boolean).length+1))*(routePoints.length-1))))]:null;const c=stopCoords[i]||fallback;return c?<Marker key={`stop-${i}`} coordinate={c} title={`Parada ${i+1}`} description={label} pinColor={GREEN}/>:null})}<Marker coordinate={routePoints[routePoints.length-1]} title="Destino" pinColor={ORANGE}/></MapView>'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Commit map v3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-rc11/src/TripPlannerScreen.tsx
          git commit -m 'RC11.6: map alternatives, repeated touch and stop markers'
          git push origin HEAD:movvant-mobile-rc11
