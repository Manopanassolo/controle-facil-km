name: Movvant RC11 build APK

on:
  workflow_dispatch:
  push:
    branches: [movvant-mobile-rc11]
    paths:
      - 'mobile-rc11/BUILD_RC11_APK'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile-rc11
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      EXPECTED_ANDROID_SHA1: '8B:83:5C:BE:A9:3B:3C:71:FC:CC:4A:78:3E:DF:CD:27:E3:9F:7F:27'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard required secrets
        run: |
          test -n "$EXPO_TOKEN" || (echo 'EXPO_TOKEN ausente' && exit 1)
          test -n "$GOOGLE_MAPS_API_KEY" || (echo 'GOOGLE_MAPS_API_KEY ausente' && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install EAS CLI
        run: npm install --global eas-cli
      - name: Quality gate
        run: |
          npx expo-doctor
          npx tsc --noEmit
          GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" npx expo config --type public > /tmp/rc11-expo-config.txt
          grep -q 'com.movvant.enterprise' /tmp/rc11-expo-config.txt
          grep -q 'ACCESS_FINE_LOCATION' /tmp/rc11-expo-config.txt
      - name: Build signed Android homologation APK on GitHub runner
        run: |
          mkdir -p dist
          eas env:exec preview "eas build --platform android --profile preview --local --non-interactive --freeze-credentials --output dist/Movvant-RC11-homologacao.apk" --non-interactive
      - name: Verify APK and signing certificate
        run: |
          set -euo pipefail
          APK='dist/Movvant-RC11-homologacao.apk'
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -x "$APKSIGNER" || (echo 'apksigner nao encontrado no Android SDK' && exit 1)
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -nE 's/^.*certificate SHA-1 digest:[[:space:]]*//p' | head -1 | tr -d ':\r ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA1="$(printf '%s' "$EXPECTED_ANDROID_SHA1" | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          echo "APK gerado: $(du -h "$APK" | cut -f1)"
          echo "Certificado SHA-1 normalizado: $ACTUAL_SHA1"
          test -n "$ACTUAL_SHA1" || (echo 'Nao foi possivel ler a assinatura moderna do APK' && exit 1)
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1" || (echo 'Assinatura diferente da credencial Android esperada; publicacao bloqueada.' && exit 1)
          echo 'Assinatura Android validada para Google Maps.'
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Movvant-RC11-APK-SIGNED
          path: mobile-rc11/dist/Movvant-RC11-homologacao.apk
          retention-days: 30
      - name: Publish direct Android download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='movvant-rc11-homologacao'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'Movvant RC11 — Homologação Android' --notes 'APK assinado para homologação Android. Gerado automaticamente após quality gate e validação da assinatura.'
          gh release upload "$TAG" dist/Movvant-RC11-homologacao.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "Download direto: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Movvant-RC11-homologacao.apk"
