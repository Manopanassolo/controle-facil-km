name: Movvant RC11 build APK

on:
  workflow_dispatch:
  push:
    branches: [movvant-mobile-rc11]
    paths:
      - 'mobile-rc11/BUILD_RC11_APK'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-rc11
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard required secrets
        run: |
          test -n "$EXPO_TOKEN" || (echo 'EXPO_TOKEN ausente' && exit 1)
          test -n "$GOOGLE_MAPS_API_KEY" || (echo 'GOOGLE_MAPS_API_KEY ausente' && exit 1)
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install EAS CLI for environment access only
        run: npm install --global eas-cli
      - name: Quality gate
        run: |
          npx expo-doctor
          npx tsc --noEmit
          GOOGLE_MAPS_API_KEY="$GOOGLE_MAPS_API_KEY" npx expo config --type public > /tmp/rc11-expo-config.txt
          grep -q 'com.movvant.enterprise' /tmp/rc11-expo-config.txt
          grep -q 'ACCESS_FINE_LOCATION' /tmp/rc11-expo-config.txt
      - name: Generate Android native project with preview environment
        run: eas env:exec preview "npx expo prebuild --platform android --clean --non-interactive" --non-interactive
      - name: Build Android homologation APK locally on GitHub runner
        run: eas env:exec preview "cd android && chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon" --non-interactive
      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Movvant-RC11-homologacao.apk
      - name: Upload APK for Android installation
        uses: actions/upload-artifact@v4
        with:
          name: Movvant-RC11-APK
          path: mobile-rc11/dist/Movvant-RC11-homologacao.apk
          retention-days: 30
