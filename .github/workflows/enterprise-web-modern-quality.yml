name: Movvant Enterprise Web Modern Quality
on:
  push:
    branches: [movvant-enterprise-web-modern]
    paths:
      - 'enterprise-web-modern/**'
      - '.github/workflows/enterprise-web-modern-quality.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-web-modern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: enterprise-web-modern/package.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Validate dist
        run: test -f dist/index.html && grep -q 'Movvant Enterprise' dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: movvant-enterprise-web-modern-dist
          path: enterprise-web-modern/dist
          retention-days: 14
