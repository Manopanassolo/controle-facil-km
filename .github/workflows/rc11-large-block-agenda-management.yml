name: RC11 large block agenda management
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-large-block-agenda-management.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply agenda and management vision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/AppRC11Final.tsx')
          s=p.read_text()

          a0=s.index('function Agenda(')
          a1=s.index('\nfunction Km(',a0)
          agenda=r'''function Agenda({ appointments, customers, onSave, onDelete }: { appointments: Appointment[]; customers: CustomerRow[]; onSave: (item: LocalAppointment) => Promise<void>; onDelete: (id: string) => Promise<void> }) {
  const now=new Date();
  const [cursor,setCursor]=useState(new Date(now.getFullYear(),now.getMonth(),1));
  const [selected,setSelected]=useState(isoDate(now));
  const [open,setOpen]=useState(false);
  const [editing,setEditing]=useState<Appointment|null>(null);
  const [title,setTitle]=useState('');
  const [time,setTime]=useState('09:00');
  const [customer,setCustomer]=useState<CustomerRow|null>(null);
  const [picker,setPicker]=useState(false);
  const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const cells=Array.from({length:first+days},(_,i)=>i<first?null:i-first+1);
  const monthPrefix=`${y}-${pad(m+1)}`;
  const monthItems=useMemo(()=>appointments.filter(x=>x.date.startsWith(monthPrefix)).sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)),[appointments,monthPrefix]);
  const dayItems=useMemo(()=>appointments.filter(x=>x.date===selected).sort((a,b)=>a.time.localeCompare(b.time)),[appointments,selected]);
  const selectedObj=new Date(`${selected}T12:00:00`);
  const change=(d:number)=>{const n=new Date(y,m+d,1);setCursor(n);setSelected(isoDate(n.getFullYear()===now.getFullYear()&&n.getMonth()===now.getMonth()?now:n));};
  const newItem=()=>{setEditing(null);setTitle('');setTime('09:00');setCustomer(null);setOpen(true);};
  const openItem=(item:Appointment)=>{setEditing(item);setTitle(item.title);setTime(item.time);setCustomer(customers.find(c=>c.id===item.customerId)||null);setOpen(true);};
  const save=async()=>{
    if(editing && !editing.local) return setOpen(false);
    if(!title.trim()) return Alert.alert('Compromisso','Informe um título.');
    if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)) return Alert.alert('Horário','Use o formato HH:MM.');
    const item:LocalAppointment={id:editing?.id||`${Date.now()}-appointment`,date:selected,time,title:title.trim(),store:customer?customerName(customer):editing?.store||'Sem loja definida',type:'Compromisso',customerId:customer?.id||editing?.customerId,synced:false};
    await onSave(item);setOpen(false);setEditing(null);
  };
  const remove=()=>{if(!editing?.local)return;Alert.alert('Excluir compromisso','Deseja remover este compromisso do aparelho?',[{text:'Cancelar',style:'cancel'},{text:'Excluir',style:'destructive',onPress:async()=>{await onDelete(editing.id);setOpen(false);setEditing(null);}}]);};
  const statusText=(x:Appointment)=>x.local?'Aguardando sincronização':/complete|done|realiz|finish/i.test(x.status||'')?'Realizada':'Sincronizada';
  return <ScrollView contentContainerStyle={s.content}>
    <View style={s.agendaHero}><Text style={s.agendaEyebrow}>AGENDA COMERCIAL</Text><Text style={s.agendaHeroTitle}>Compromissos e visitas</Text><Text style={s.agendaHeroText}>Planeje o mês, acompanhe o dia e visualize o estado de cada compromisso.</Text></View>
    <View style={s.agendaSummary}><View style={s.agendaSummaryItem}><Text style={s.agendaSummaryValue}>{monthItems.length}</Text><Text style={s.agendaSummaryLabel}>No mês</Text></View><View style={s.agendaSummaryItem}><Text style={s.agendaSummaryValue}>{dayItems.length}</Text><Text style={s.agendaSummaryLabel}>No dia</Text></View><View style={s.agendaSummaryItem}><Text style={s.agendaSummaryValue}>{monthItems.filter(x=>x.local).length}</Text><Text style={s.agendaSummaryLabel}>Pendentes</Text></View></View>
    <View style={s.calendar}><View style={s.monthHead}><Pressable style={s.monthNav} onPress={()=>change(-1)}><Text style={s.arrow}>‹</Text></Pressable><View><Text style={s.monthTitle}>{MONTHS[m]} {y}</Text><Text style={s.monthSub}>{monthItems.length} compromisso(s) no mês</Text></View><Pressable style={s.monthNav} onPress={()=>change(1)}><Text style={s.arrow}>›</Text></Pressable></View><View style={s.week}>{['D','S','T','Q','Q','S','S'].map((x,i)=><Text key={i} style={s.weekText}>{x}</Text>)}</View><View style={s.days}>{cells.map((d,i)=>!d?<View key={`e-${i}`} style={s.dayCell}/>:<Pressable key={d} style={s.dayCell} onPress={()=>setSelected(isoDate(new Date(y,m,d)))}><View style={[s.dayCircle,selected===isoDate(new Date(y,m,d))&&s.daySelected,appointments.some(x=>x.date===isoDate(new Date(y,m,d)))&&selected!==isoDate(new Date(y,m,d))&&s.dayHasEvent]}><Text style={[s.dayText,selected===isoDate(new Date(y,m,d))&&s.dayTextSelected]}>{d}</Text>{appointments.some(x=>x.date===isoDate(new Date(y,m,d)))&&<View style={[s.dayDot,selected===isoDate(new Date(y,m,d))&&{backgroundColor:'#fff'}]}/>}</View></Pressable>)}</View></View>
    <View style={s.sectionHead}><View><Text style={s.sectionTitle}>{WEEK[selectedObj.getDay()]}, {selectedObj.getDate()} de {MONTHS[selectedObj.getMonth()].toLowerCase()}</Text><Text style={s.sub}>{dayItems.length?`${dayItems.length} compromisso(s)`:'Agenda livre'}</Text></View><Pressable style={s.newAgendaButton} onPress={newItem}><Text style={s.newAgendaButtonText}>+ Novo</Text></Pressable></View>
    {dayItems.length?dayItems.map(x=><Pressable key={x.id} style={s.agendaDetailCard} onPress={()=>openItem(x)}><View style={s.agendaDateBadge}><Text style={s.agendaDateDay}>{Number(x.date.slice(8,10))}</Text><Text style={s.agendaDateMonth}>{MONTHS[Number(x.date.slice(5,7))-1].slice(0,3).toUpperCase()}</Text></View><View style={{flex:1}}><Text style={s.store}>{x.store}</Text><Text style={s.agendaTitleLine}>{x.title}</Text><Text style={s.sub}>{x.time}</Text><View style={s.agendaBadges}><View style={[s.agendaState,x.local?s.agendaStatePending:s.agendaStateOk]}><Text style={[s.agendaStateText,x.local?s.agendaStateTextPending:s.agendaStateTextOk]}>{statusText(x)}</Text></View>{x.customerId&&<View style={s.agendaSource}><Text style={s.agendaSourceText}>Loja vinculada</Text></View>}</View></View><Text style={s.rowArrow}>›</Text></Pressable>):<Empty title="Nenhum compromisso" text="Toque em + Novo para adicionar uma visita, reunião ou compromisso."/>}
    {monthItems.length>0&&<View style={s.monthList}><Text style={s.sectionTitle}>Compromissos do mês</Text>{monthItems.slice(0,12).map(x=><Pressable key={`m-${x.id}`} style={s.monthListRow} onPress={()=>{setSelected(x.date);openItem(x)}}><View style={s.monthListDate}><Text style={s.monthListDay}>{Number(x.date.slice(8,10))}</Text><Text style={s.monthListMon}>{MONTHS[Number(x.date.slice(5,7))-1].slice(0,3).toUpperCase()}</Text></View><View style={{flex:1}}><Text style={s.rowTitle} numberOfLines={1}>{x.title}</Text><Text style={s.sub} numberOfLines={1}>{x.time} · {x.store}</Text></View><Text style={[s.monthListStatus,x.local&&{color:ORANGE}]}>{x.local?'Local':'✓'}</Text></Pressable>)}</View>}
    <Modal visible={open} animationType="slide" onRequestClose={()=>setOpen(false)}><SafeAreaView style={s.screen}><View style={s.modalHeader}><Pressable onPress={()=>setOpen(false)}><Text style={s.modalBack}>‹</Text></Pressable><Text style={s.modalTitle}>{editing?'Compromisso':'Novo compromisso'}</Text><View style={{width:32}}/></View><ScrollView contentContainerStyle={s.content}><Field label="Título" value={title} setValue={setTitle} editable={!editing||Boolean(editing.local)} placeholder="Ex.: Visita comercial"/><Field label="Data" value={`${pad(selectedObj.getDate())}/${pad(selectedObj.getMonth()+1)}/${selectedObj.getFullYear()}`} setValue={()=>{}} editable={false}/><Field label="Horário" value={time} setValue={setTime} editable={!editing||Boolean(editing.local)}/><View style={s.field}><Text style={s.label}>Loja</Text><Pressable style={s.inputButton} onPress={()=>!editing||editing.local?setPicker(true):undefined}><Text style={customer?s.inputButtonText:s.inputPlaceholder}>{customer?customerName(customer):editing?.store||'Selecionar loja'}</Text><Text style={s.rowArrow}>›</Text></Pressable></View>{editing&&!editing.local?<Empty title="Compromisso sincronizado" text={`Status: ${editing.status||'planejado'}. Alterações remotas respeitam a permissão empresarial.`}/>:<Pressable style={s.primary} onPress={save}><Text style={s.primaryText}>{editing?'Salvar alterações':'Salvar compromisso'}</Text></Pressable>}{editing?.local&&<Pressable style={s.logout} onPress={remove}><Text style={s.logoutText}>Excluir compromisso</Text></Pressable>}</ScrollView><CustomerPicker visible={picker} customers={customers} selected={customer?.id} close={()=>setPicker(false)} select={setCustomer}/></SafeAreaView></Modal>
  </ScrollView>;
}
'''
          s=s[:a0]+agenda+s[a1:]

          r0=s.index('function Reports(')
          r1=s.index('\nfunction Notifications(',r0)
          reports=r'''function Reports({ data, local }: { data: BootstrapData | null; local: LocalState }) {
  const perf=data?.performance;
  const [period,setPeriod]=useState<'day'|'week'|'month'>('month');
  const now=new Date();
  const start=useMemo(()=>{const d=new Date(now);d.setHours(0,0,0,0);if(period==='week')d.setDate(d.getDate()-6);if(period==='month')d.setDate(1);return d.getTime()},[period]);
  const end=Date.now();
  const localKmRecords=local.km.filter(x=>{const t=new Date(x.createdAt).getTime();return t>=start&&t<=end});
  const localTrips=local.trips.filter(x=>x.finishedAt>=start&&x.finishedAt<=end);
  const localVisits=local.visits.filter(x=>{const t=new Date(x.updatedAt).getTime();return t>=start&&t<=end});
  const localKm=localKmRecords.reduce((n,x)=>n+x.total,0),tripKm=localTrips.reduce((n,x)=>n+x.distanceMeters/1000,0),tripMinutes=localTrips.reduce((n,x)=>n+x.elapsedMs/60000,0);
  const periodLabel=period==='day'?'Hoje':period==='week'?'Últimos 7 dias':'Este mês';
  const share=async()=>{const text=[`Movvant Enterprise — visão gerencial`,`Período local: ${periodLabel}`,`KM registrado: ${localKm.toFixed(1)} km`,`Deslocamentos: ${localTrips.length}`,`Tempo em deslocamento: ${Math.round(tripMinutes)} min`,`Visitas locais: ${localVisits.length}`,`Visitas remotas 30d: ${num(perf?.visits_30d)}`,`Receita remota 30d: ${money(perf?.revenue_30d)}`].join('\n');await Share.share({message:text,title:'Visão gerencial Movvant'});};
  return <ScrollView contentContainerStyle={s.content}>
    <View style={s.managementHero}><Text style={s.agendaEyebrow}>VISÃO GERENCIAL</Text><Text style={s.managementTitle}>Operação em números</Text><Text style={s.managementText}>Acompanhe deslocamentos, KM, visitas e indicadores comerciais do período.</Text></View>
    <View style={s.periodTabs}><Pressable style={[s.periodTab,period==='day'&&s.periodTabOn]} onPress={()=>setPeriod('day')}><Text style={[s.periodTabText,period==='day'&&s.periodTabTextOn]}>Dia</Text></Pressable><Pressable style={[s.periodTab,period==='week'&&s.periodTabOn]} onPress={()=>setPeriod('week')}><Text style={[s.periodTabText,period==='week'&&s.periodTabTextOn]}>Semana</Text></Pressable><Pressable style={[s.periodTab,period==='month'&&s.periodTabOn]} onPress={()=>setPeriod('month')}><Text style={[s.periodTabText,period==='month'&&s.periodTabTextOn]}>Mês</Text></Pressable></View>
    <View style={s.periodCard}><Text style={s.periodLabel}>PERÍODO SELECIONADO</Text><Text style={s.periodValue}>{periodLabel}</Text><Text style={s.sub}>{new Date(start).toLocaleDateString('pt-BR')} → {new Date(end).toLocaleDateString('pt-BR')}</Text></View>
    <View style={s.reportGrid}><View style={s.reportCard}><Text style={s.reportKicker}>KM NO PERÍODO</Text><Text style={s.reportValue}>{localKm.toFixed(1)} km</Text><Text style={s.metricLabel}>{localKmRecords.length} lançamento(s) de KM</Text></View><View style={s.reportCard}><Text style={s.reportKicker}>DESLOCAMENTOS</Text><Text style={s.reportValue}>{localTrips.length}</Text><Text style={s.metricLabel}>{tripKm.toFixed(1)} km rastreados</Text></View><View style={s.reportCard}><Text style={s.reportKicker}>TEMPO EM ROTA</Text><Text style={s.reportValue}>{Math.round(tripMinutes)} min</Text><Text style={s.metricLabel}>Tempo rastreado localmente</Text></View><View style={s.reportCard}><Text style={s.reportKicker}>VISITAS</Text><Text style={s.reportValue}>{localVisits.length}</Text><Text style={s.metricLabel}>Movimentações de visita no período</Text></View></View>
    <View style={s.reportWide}><Text style={s.reportWideTitle}>Indicadores empresariais · 30 dias</Text><Text style={s.reportWideSub}>Dados consolidados liberados pela base empresarial.</Text><View style={s.reportLine}><Text style={s.sub}>Visitas</Text><Text style={s.reportLineValue}>{num(perf?.visits_30d)}</Text></View><View style={s.reportLine}><Text style={s.sub}>Visitas validadas</Text><Text style={s.reportLineValue}>{num(perf?.validated_visits_30d)}</Text></View><View style={s.reportLine}><Text style={s.sub}>KM remoto</Text><Text style={s.reportLineValue}>{num(perf?.actual_km_30d).toFixed(1)} km</Text></View><View style={s.reportLine}><Text style={s.sub}>Aderência</Text><Text style={s.reportLineValue}>{num(perf?.avg_adherence_pct).toFixed(0)}%</Text></View><View style={s.reportLine}><Text style={s.sub}>Pedidos</Text><Text style={s.reportLineValue}>{num(perf?.orders_30d)}</Text></View><View style={s.reportLine}><Text style={s.sub}>Receita</Text><Text style={s.reportLineValue}>{money(perf?.revenue_30d)}</Text></View></View>
    <View style={s.analysisCard}><Text style={s.reportWideTitle}>Leitura operacional</Text><Text style={s.analysisText}>{localTrips.length===0?'Sem deslocamentos registrados neste período.':'A operação registrou deslocamentos no período selecionado.'}</Text><Text style={s.analysisText}>{localKmRecords.length===0?'Nenhum lançamento manual de KM neste período.':`${localKmRecords.length} lançamento(s) de KM somando ${localKm.toFixed(1)} km.`}</Text><Text style={s.analysisText}>{localVisits.length===0?'Nenhuma movimentação local de visita neste período.':`${localVisits.length} movimentação(ões) de visita registradas localmente.`}</Text></View>
    <Pressable style={s.primary} onPress={share}><Text style={s.primaryText}>Compartilhar visão gerencial</Text></Pressable>
    {!perf&&<Empty title="Indicadores remotos ainda indisponíveis" text="Os números locais continuam funcionando; a parte empresarial será preenchida quando a base liberar os indicadores."/>}
  </ScrollView>;
}
'''
          s=s[:r0]+reports+s[r1:]

          marker="  modalHeader:{height:58+(StatusBar.currentHeight||0),paddingTop:StatusBar.currentHeight||0,backgroundColor:NAVY"
          styles="""  agendaHero:{backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:24,padding:18},agendaEyebrow:{fontSize:9,letterSpacing:1.8,color:BLUE,fontWeight:'900'},agendaHeroTitle:{fontSize:22,fontWeight:'900',color:NAVY,marginTop:5},agendaHeroText:{fontSize:11,color:MUTED,lineHeight:17,marginTop:5},agendaSummary:{flexDirection:'row',gap:8},agendaSummaryItem:{flex:1,backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:16,padding:12},agendaSummaryValue:{fontSize:20,fontWeight:'900',color:NAVY},agendaSummaryLabel:{fontSize:9,color:MUTED,marginTop:3},monthNav:{width:42,height:42,borderRadius:13,borderWidth:1,borderColor:BORDER,alignItems:'center',justifyContent:'center'},monthSub:{fontSize:9,color:MUTED,textAlign:'center',marginTop:2},dayHasEvent:{backgroundColor:'#F0F4FA'},newAgendaButton:{minHeight:40,paddingHorizontal:14,borderRadius:12,borderWidth:1,borderColor:NAVY,alignItems:'center',justifyContent:'center'},newAgendaButtonText:{fontSize:11,fontWeight:'900',color:NAVY},agendaDetailCard:{minHeight:112,backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:19,padding:13,flexDirection:'row',alignItems:'center',gap:12},agendaDateBadge:{width:52,height:64,borderRadius:14,backgroundColor:'#F2F5F9',alignItems:'center',justifyContent:'center'},agendaDateDay:{fontSize:20,fontWeight:'900',color:NAVY},agendaDateMonth:{fontSize:8,fontWeight:'800',color:MUTED,marginTop:2},agendaTitleLine:{fontSize:11,fontWeight:'800',color:TEXT,marginTop:2},agendaBadges:{flexDirection:'row',flexWrap:'wrap',gap:6,marginTop:7},agendaState:{paddingHorizontal:9,paddingVertical:5,borderRadius:10},agendaStateOk:{backgroundColor:'#E8F7F0'},agendaStatePending:{backgroundColor:'#FFF3E5'},agendaStateText:{fontSize:8,fontWeight:'900'},agendaStateTextOk:{color:GREEN},agendaStateTextPending:{color:ORANGE},agendaSource:{paddingHorizontal:9,paddingVertical:5,borderRadius:10,backgroundColor:'#EAF2FE'},agendaSourceText:{fontSize:8,fontWeight:'900',color:BLUE},monthList:{backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:20,padding:14,gap:8},monthListRow:{minHeight:62,flexDirection:'row',alignItems:'center',gap:10,borderBottomWidth:1,borderBottomColor:'#EEF2F5'},monthListDate:{width:42,alignItems:'center'},monthListDay:{fontSize:16,fontWeight:'900',color:NAVY},monthListMon:{fontSize:7,fontWeight:'800',color:MUTED},monthListStatus:{fontSize:11,fontWeight:'900',color:GREEN},managementHero:{backgroundColor:NAVY,borderRadius:24,padding:20},managementTitle:{fontSize:24,fontWeight:'900',color:'#fff',marginTop:5},managementText:{fontSize:11,color:'#D0DCE6',lineHeight:17,marginTop:5},periodTabs:{backgroundColor:'#E9EEF4',borderRadius:18,padding:4,flexDirection:'row'},periodTab:{flex:1,minHeight:46,borderRadius:14,alignItems:'center',justifyContent:'center'},periodTabOn:{backgroundColor:NAVY,elevation:2},periodTabText:{fontSize:11,fontWeight:'800',color:MUTED},periodTabTextOn:{color:'#fff'},periodCard:{backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:18,padding:15},periodLabel:{fontSize:9,fontWeight:'900',letterSpacing:1,color:MUTED},periodValue:{fontSize:18,fontWeight:'900',color:NAVY,marginTop:4},reportKicker:{fontSize:9,fontWeight:'900',letterSpacing:.8,color:MUTED},reportWideTitle:{fontSize:15,fontWeight:'900',color:NAVY},reportWideSub:{fontSize:10,color:MUTED,marginBottom:4},analysisCard:{backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:18,padding:15,gap:8},analysisText:{fontSize:11,color:TEXT,lineHeight:17},\n"""
          if marker not in s: raise SystemExit('style marker not found')
          s=s.replace(marker,styles+marker,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile-rc11/AppRC11Final.tsx
          git commit -m 'RC11: evolve agenda and management vision'
          git push