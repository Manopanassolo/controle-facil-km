name: Movvant V2 Manual Vercel Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref_name == 'movvant-v2-rebuild'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movvant-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movvant-v2/package-lock.json

      - name: Verify required Vercel secrets
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.MOVVANT_V2_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.MOVVANT_V2_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MOVVANT_V2_VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'MOVVANT_V2_VERCEL_TOKEN ausente'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'MOVVANT_V2_VERCEL_ORG_ID ausente'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'MOVVANT_V2_VERCEL_PROJECT_ID ausente'; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Architecture and TypeScript gates
        run: npm run guard && npm run typecheck

      - name: Install Vercel CLI
        run: npm install --no-save vercel@latest

      - name: Pull preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.MOVVANT_V2_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.MOVVANT_V2_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MOVVANT_V2_VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview
        env:
          VERCEL_TOKEN: ${{ secrets.MOVVANT_V2_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.MOVVANT_V2_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MOVVANT_V2_VERCEL_PROJECT_ID }}
        run: npx vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview only
        env:
          VERCEL_TOKEN: ${{ secrets.MOVVANT_V2_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.MOVVANT_V2_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MOVVANT_V2_VERCEL_PROJECT_ID }}
        run: |
          URL=$(npx vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Preview V2: $URL"
          echo "MOVVANT_V2_PREVIEW_URL=$URL" >> "$GITHUB_ENV"

      - name: Deployment summary
        run: |
          echo '### Movvant V2 — preview isolado' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $MOVVANT_V2_PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Este workflow nunca usa --prod e só aceita a branch movvant-v2-rebuild.' >> "$GITHUB_STEP_SUMMARY"
