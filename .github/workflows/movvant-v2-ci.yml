name: Movvant V2 CI

on:
  push:
    branches:
      - movvant-v2-rebuild
    paths:
      - 'movvant-v2/**'
      - '.github/workflows/movvant-v2-ci.yml'
  pull_request:
    paths:
      - 'movvant-v2/**'
      - '.github/workflows/movvant-v2-ci.yml'

permissions:
  contents: write

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movvant-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Persist lockfile on rebuild branch
        if: github.event_name == 'push'
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Lock Movvant V2 dependencies"
            git push origin HEAD:movvant-v2-rebuild
          fi

      - name: Architecture guard
        run: npm run guard

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build
