name: RC11.2 Google auth fix
# trigger-2026-09-04-2
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-google-auth-fix.yml']
permissions:
  contents: write
jobs:
  fix-google-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install current dependencies
        working-directory: mobile-rc11
        run: npm install --no-audit --no-fund
      - name: Install Expo web browser
        working-directory: mobile-rc11
        run: npx expo install expo-web-browser
      - name: Patch Google authentication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api = Path('mobile-rc11/src/api.ts')
          text = api.read_text()
          if "expo-web-browser" not in text:
              text = "import * as WebBrowser from 'expo-web-browser';\n\n" + text
          anchor = "export async function signIn(email: string, password: string): Promise<Session> {"
          google_code = r'''export async function signInWithGoogle(): Promise<Session> {
  const { url, key } = env();
  const redirectTo = 'movvant://google-auth';
  const authorizeUrl = `${url}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(redirectTo)}&prompt=consent`;
  WebBrowser.maybeCompleteAuthSession();
  const result = await WebBrowser.openAuthSessionAsync(authorizeUrl, redirectTo, { showInRecents: true });
  if (result.type !== 'success' || !('url' in result) || !result.url) {
    throw new Error(result.type === 'cancel' || result.type === 'dismiss' ? 'Login Google cancelado.' : 'Não foi possível concluir o login Google.');
  }
  const callback = new URL(result.url);
  const hashParams = new URLSearchParams(callback.hash.replace(/^#/, ''));
  const accessToken = hashParams.get('access_token') || callback.searchParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token') || callback.searchParams.get('refresh_token') || undefined;
  const expiresIn = Number(hashParams.get('expires_in') || callback.searchParams.get('expires_in') || '3600');
  const tokenType = hashParams.get('token_type') || callback.searchParams.get('token_type') || 'bearer';
  const errorDescription = hashParams.get('error_description') || callback.searchParams.get('error_description');
  if (errorDescription) throw new Error(errorDescription);
  if (!accessToken) throw new Error('Google autenticou, mas a sessão não retornou ao Movvant. Verifique o redirecionamento OAuth.');
  const userResponse = await fetch(`${url}/auth/v1/user`, {
    headers: { apikey: key, Authorization: `Bearer ${accessToken}` },
  });
  const user = await parseResponse<Session['user']>(userResponse);
  return {
    access_token: accessToken,
    refresh_token: refreshToken,
    expires_in: expiresIn,
    expires_at: Math.floor(Date.now() / 1000) + expiresIn,
    token_type: tokenType,
    user,
  };
}

'''
          if 'export async function signInWithGoogle' not in text:
              text = text.replace(anchor, google_code + anchor)
          api.write_text(text)

          app = Path('mobile-rc11/AppRC11Final.tsx')
          text = app.read_text()
          text = text.replace("import { BootstrapData, CustomerRow, NotificationRow, Session, VehicleRow, loadBootstrap, markNotificationRead, refreshSession, signIn } from './src/api';", "import { BootstrapData, CustomerRow, NotificationRow, Session, VehicleRow, loadBootstrap, markNotificationRead, refreshSession, signIn, signInWithGoogle } from './src/api';")
          text = text.replace("const [email,setEmail] = useState(''); const [password,setPassword] = useState(''); const [loading,setLoading] = useState(false);", "const [email,setEmail] = useState(''); const [password,setPassword] = useState(''); const [loading,setLoading] = useState(false); const [googleLoading,setGoogleLoading] = useState(false);")
          old_submit_end = "finally { setLoading(false); }\n  };\n  return <SafeAreaView"
          new_submit_end = "finally { setLoading(false); }\n  };\n  const submitGoogle = async () => {\n    setGoogleLoading(true);\n    try {\n      const session = await signInWithGoogle();\n      await AsyncStorage.setItem(SESSION_KEY, JSON.stringify(session));\n      onLogin(session);\n    } catch (e) { Alert.alert('Não foi possível entrar com Google', e instanceof Error ? e.message : 'Tente novamente.'); }\n    finally { setGoogleLoading(false); }\n  };\n  return <SafeAreaView"
          if old_submit_end not in text:
              raise SystemExit('Login submit anchor not found')
          text = text.replace(old_submit_end, new_submit_end)
          old_button = "<Pressable style={[s.primary, loading && s.disabled]} onPress={submit} disabled={loading}><Text style={s.primaryText}>{loading ? 'Entrando...' : 'Entrar'}</Text></Pressable><Text style={s.loginFoot}>"
          new_button = "<Pressable style={[s.primary, loading && s.disabled]} onPress={submit} disabled={loading || googleLoading}><Text style={s.primaryText}>{loading ? 'Entrando...' : 'Entrar'}</Text></Pressable><View style={{ flexDirection: 'row', alignItems: 'center', gap: 10, marginVertical: 14 }}><View style={{ flex: 1, height: 1, backgroundColor: BORDER }}/><Text style={{ color: MUTED, fontSize: 13 }}>ou</Text><View style={{ flex: 1, height: 1, backgroundColor: BORDER }}/></View><Pressable style={[{ minHeight: 54, borderWidth: 1, borderColor: BORDER, borderRadius: 16, alignItems: 'center', justifyContent: 'center', backgroundColor: '#FFFFFF' }, googleLoading && s.disabled]} onPress={submitGoogle} disabled={loading || googleLoading}><Text style={{ color: TEXT, fontWeight: '800', fontSize: 16 }}>{googleLoading ? 'Conectando ao Google...' : 'G  Entrar com Google'}</Text></Pressable><Text style={s.loginFoot}>"
          if old_button not in text:
              raise SystemExit('Login button anchor not found')
          text = text.replace(old_button, new_button)
          text = text.replace('Movvant Mobile · RC11 Final', 'Movvant Mobile · RC11.2')
          app.write_text(text)

          cfg = Path('mobile-rc11/app.config.js')
          text = cfg.read_text()
          text = text.replace("version: '1.1.0',", "version: '1.1.1',")
          if "scheme: 'movvant'" not in text:
              text = text.replace("owner: 'movant',", "owner: 'movant',\n    scheme: 'movvant',")
          if "expo-web-browser" not in text:
              text = text.replace("plugins: [", "plugins: [\n      ['expo-web-browser', { experimentalLauncherActivity: false }],", 1)
          text = text.replace('versionCode: 25', 'versionCode: 26')
          text = text.replace("releaseChannel: 'rc11-final'", "releaseChannel: 'rc11.2-google-auth'")
          cfg.write_text(text)
          PY
      - name: Quality checks
        working-directory: mobile-rc11
        run: |
          npx expo-doctor
          npx tsc --noEmit
          npx expo config --type public > /tmp/rc11-config.json
          grep -q 'movvant' /tmp/rc11-config.json
          grep -q 'com.movvant.enterprise' /tmp/rc11-config.json
      - name: Commit RC11.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-rc11/package.json mobile-rc11/package-lock.json mobile-rc11/src/api.ts mobile-rc11/AppRC11Final.tsx mobile-rc11/app.config.js
          git commit -m 'RC11.2: restore Google login on Android'
          git push origin HEAD:movvant-mobile-rc11
