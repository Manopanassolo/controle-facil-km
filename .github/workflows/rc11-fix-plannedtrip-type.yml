name: RC11 planned trip compatibility
on:
  push:
    paths:
      - '.github/workflows/rc11-fix-plannedtrip-type.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - name: Patch optional legacy vehicle fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/src/TripPlannerScreen.tsx')
          s=p.read_text()
          old='routeLabel:string;vehicleId:string;vehiclePlate:string;polyline?'
          new='routeLabel:string;vehicleId?:string;vehiclePlate?:string;polyline?'
          if old not in s: raise SystemExit('pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-rc11/src/TripPlannerScreen.tsx
          git commit -m "RC11.3: support legacy planned trips without vehicle" || exit 0
          git push origin HEAD:movvant-mobile-rc11
