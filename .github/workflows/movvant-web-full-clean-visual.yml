name: Movvant Web Full Clean Visual
on:
  push:
    branches: [movvant-enterprise-web-full-transplant]
    paths:
      - '.github/workflows/movvant-web-full-clean-visual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean-build-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-enterprise-web-full-transplant
      - name: Remove remaining fictitious fleet and document records
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('movvant-v2/src/components/SessionActivityProvider.tsx')
          s=p.read_text()
          s=re.sub(r"const baseVehicles:SessionVehicle\[\]=\[.*?\];\nconst baseDocuments:SessionDocument\[\]=\[.*?\];", "const baseVehicles:SessionVehicle[]=[];\nconst baseDocuments:SessionDocument[]=[];", s, count=1, flags=re.S)
          p.write_text(s)
          PY
      - name: Verify fictitious operational records are gone
        run: |
          ! grep -R -E "Casa do MDF|Cliente regional|Nova conta|Veículo demonstrativo|ABC1D23|DEF4G56|GHI7J89|Documento demonstrativo|Licenciamento demonstrativo|Apólice demonstrativa" movvant-v2/src --exclude-dir=.next
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movvant-v2/package-lock.json
      - name: Install
        working-directory: movvant-v2
        run: npm ci
      - name: Guard, typecheck and build
        working-directory: movvant-v2
        run: npm run build
      - name: Commit clean operational base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movvant-v2/src/components/SessionActivityProvider.tsx
          git diff --cached --quiet || git commit -m "Web full transplant: remover dados operacionais fictícios"
          git push origin HEAD:movvant-enterprise-web-full-transplant
      - name: Install Playwright Chromium
        working-directory: movvant-v2
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start built Web
        working-directory: movvant-v2
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/movvant-web.log 2>&1 &
          echo $! > /tmp/movvant-web.pid
          for i in {1..40}; do curl -fsS http://127.0.0.1:3000/dashboard >/dev/null && exit 0; sleep 1; done
          cat /tmp/movvant-web.log
          exit 1
      - name: Capture real screens
        working-directory: movvant-v2
        run: |
          mkdir -p visual-proof
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1100},deviceScaleFactor:1});
            await page.goto('http://127.0.0.1:3000/inteligencia',{waitUntil:'networkidle'});
            await page.screenshot({path:'visual-proof/inteligencia-real.png',fullPage:true});
            await page.goto('http://127.0.0.1:3000/agenda',{waitUntil:'networkidle'});
            await page.screenshot({path:'visual-proof/agenda-real.png',fullPage:true});
            await page.goto('http://127.0.0.1:3000/dashboard',{waitUntil:'networkidle'});
            await page.screenshot({path:'visual-proof/dashboard-real.png',fullPage:true});
            await browser.close();
          })();
          NODE
      - name: Upload real visual proof
        uses: actions/upload-artifact@v4
        with:
          name: movvant-web-full-real-visual
          path: movvant-v2/visual-proof/*.png
          if-no-files-found: error
