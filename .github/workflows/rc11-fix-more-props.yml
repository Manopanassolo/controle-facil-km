name: RC11.4 fix More props
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-fix-more-props.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - name: Patch More props type
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/AppRC11Final.tsx')
          s=p.read_text()
          old="onRead: (id: string) => Promise<void>; logout: () => void }) {"
          new="onRead: (id: string) => Promise<void>; logout: () => void; onOpenTimeline?:()=>void; onOpenAdmin?:()=>void }) {"
          if old not in s: raise SystemExit('target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/rc11-fix-more-props.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "RC11.4: fix operational menu callback types"
          git push origin movvant-mobile-rc11
