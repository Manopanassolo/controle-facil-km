name: Movvant V2 Pages Preview

on:
  push:
    branches:
      - movvant-v2-rebuild
    paths:
      - 'movvant-v2/**'
      - '.github/workflows/movvant-v2-pages-preview.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: movvant-v2-pages-preview
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movvant-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movvant-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate architecture
        run: npm run guard

      - name: TypeScript
        run: npm run typecheck

      - name: Build static preview
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: movvant-v2/out

  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
