name: RC11 trip map and planned costs large block
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-trip-map-costs-large-block.yml']
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Add visual route map stop order and planned expenses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/src/TripPlannerScreen.tsx');s=p.read_text()
          s=s.replace("import { Modal, Pressable, SafeAreaView, ScrollView, StatusBar, StyleSheet, Switch, Text, TextInput, View } from 'react-native';","import { Alert, Modal, Pressable, SafeAreaView, ScrollView, StatusBar, StyleSheet, Switch, Text, TextInput, View } from 'react-native';\nimport MapView, { Marker, Polyline } from 'react-native-maps';",1)
          s=s.replace("export type PlannedTrip={date:string;time:string;origin:string;destination:string;stops:string[];roundTrip:boolean;optimizeStops:boolean;distanceMeters:number;durationSeconds:number;tollBRL:number;routeLabel:string;polyline?:string|null};","export type PlannedExpenseDraft={category:string;subcategory:string;amount:number;description?:string};\nexport type PlannedTrip={date:string;time:string;origin:string;destination:string;stops:string[];roundTrip:boolean;optimizeStops:boolean;distanceMeters:number;durationSeconds:number;tollBRL:number;routeLabel:string;polyline?:string|null;plannedExpenses?:PlannedExpenseDraft[]};",1)
          marker="const fmtTime=(s:number)=>{const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?`${h}h ${String(m).padStart(2,'0')}min`:`${m}min`};"
          decoder="""const decodePolyline=(encoded?:string|null)=>{if(!encoded)return[] as Array<{latitude:number;longitude:number}>;let index=0,lat=0,lng=0;const out:Array<{latitude:number;longitude:number}>=[];while(index<encoded.length){let b=0,shift=0,result=0;do{b=encoded.charCodeAt(index++)-63;result|=(b&0x1f)<<shift;shift+=5}while(b>=0x20&&index<=encoded.length);lat+=(result&1)?~(result>>1):(result>>1);shift=0;result=0;do{b=encoded.charCodeAt(index++)-63;result|=(b&0x1f)<<shift;shift+=5}while(b>=0x20&&index<=encoded.length);lng+=(result&1)?~(result>>1):(result>>1);out.push({latitude:lat/1e5,longitude:lng/1e5})}return out};\nconst regionFor=(pts:Array<{latitude:number;longitude:number}>)=>{if(!pts.length)return{latitude:-27.59,longitude:-48.55,latitudeDelta:7,longitudeDelta:7};const lats=pts.map(p=>p.latitude),lngs=pts.map(p=>p.longitude),minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);return{latitude:(minLat+maxLat)/2,longitude:(minLng+maxLng)/2,latitudeDelta:Math.max(.04,(maxLat-minLat)*1.45),longitudeDelta:Math.max(.04,(maxLng-minLng)*1.45)}};\n"""
          if marker not in s: raise SystemExit('fmt marker missing')
          s=s.replace(marker,marker+'\n'+decoder,1)
          old="const [date,setDate]=useState(initialDate),[time,setTime]=useState('08:00'),[origin,setOrigin]=useState(''),[destination,setDestination]=useState(''),[stops,setStops]=useState<string[]>([]),[roundTrip,setRoundTrip]=useState(false),[optimize,setOptimize]=useState(true),[loading,setLoading]=useState(false),[routes,setRoutes]=useState<RouteOption[]>([]),[selected,setSelected]=useState(0),[error,setError]=useState('');"
          new=old[:-1]+",[plannedExpenses,setPlannedExpenses]=useState<PlannedExpenseDraft[]>([]),[expenseCategory,setExpenseCategory]=useState('Alimentação'),[expenseValue,setExpenseValue]=useState('');"
          if old not in s: raise SystemExit('state marker missing')
          s=s.replace(old,new,1)
          old2="const addStop=()=>setStops(v=>[...v,'']); const removeStop=(i:number)=>setStops(v=>v.filter((_,n)=>n!==i));"
          new2=old2+" const moveStop=(i:number,d:number)=>setStops(v=>{const n=i+d;if(n<0||n>=v.length)return v;const a=[...v];[a[i],a[n]]=[a[n],a[i]];return a}); const addPlannedExpense=()=>{const v=Number(expenseValue.replace(',','.'));if(!Number.isFinite(v)||v<=0)return;setPlannedExpenses(x=>[...x,{category:expenseCategory.toLowerCase(),subcategory:expenseCategory,amount:v}]);setExpenseValue('')};"
          s=s.replace(old2,new2,1)
          old3="const route=routes[selected];"
          new3=old3+"\n  const routePoints=decodePolyline(route?.polyline);const mapRegion=regionFor(routePoints);const plannedOther=plannedExpenses.reduce((n,x)=>n+x.amount,0);"
          s=s.replace(old3,new3,1)
          old4="await onSave({date,time,origin:origin.trim(),destination:destination.trim(),stops:stops.filter(Boolean),roundTrip,optimizeStops:optimize,distanceMeters:route.distanceMeters,durationSeconds:seconds(route.duration),tollBRL:route.tollTotalBRL||0,routeLabel:`Rota ${selected+1}`,polyline:route.polyline});onClose()"
          new4="await onSave({date,time,origin:origin.trim(),destination:destination.trim(),stops:stops.filter(Boolean),roundTrip,optimizeStops:optimize,distanceMeters:route.distanceMeters,durationSeconds:seconds(route.duration),tollBRL:route.tollTotalBRL||0,routeLabel:`Rota ${selected+1}`,polyline:route.polyline,plannedExpenses});Alert.alert('Viagem salva na Agenda',`${date} · ${time} · ${km(route.distanceMeters)} km planejados.`);onClose()"
          if old4 not in s: raise SystemExit('save marker missing')
          s=s.replace(old4,new4,1)
          old5="<View style={{flex:1}}><PlaceField label={`Parada ${i+1}`} value={v} onChange={x=>setStops(a=>a.map((q,n)=>n===i?x:q))} customers={customers}/></View><Pressable style={s.remove} onPress={()=>removeStop(i)}><Text style={s.removeText}>×</Text></Pressable>"
          new5="<View style={{flex:1}}><PlaceField label={`Parada ${i+1}`} value={v} onChange={x=>setStops(a=>a.map((q,n)=>n===i?x:q))} customers={customers}/><View style={s.stopTools}><Pressable style={s.stopTool} onPress={()=>moveStop(i,-1)}><Text style={s.stopToolText}>↑ Subir</Text></Pressable><Pressable style={s.stopTool} onPress={()=>moveStop(i,1)}><Text style={s.stopToolText}>↓ Descer</Text></Pressable></View></View><Pressable style={s.remove} onPress={()=>removeStop(i)}><Text style={s.removeText}>×</Text></Pressable>"
          if old5 not in s: raise SystemExit('stop row marker missing')
          s=s.replace(old5,new5,1)
          old6="{error?<View style={s.error}><Text style={s.errorText}>{error}</Text></View>:null}"
          mapblock="""{error?<View style={s.error}><Text style={s.errorText}>{error}</Text></View>:null}\n    {routePoints.length>1&&<View style={s.card}><Text style={s.cardTitle}>Mapa da rota selecionada</Text><Text style={s.cardSub}>Toque em outra rota abaixo para comparar o caminho no mapa.</Text><MapView key={`${selected}-${routePoints.length}`} style={s.map} initialRegion={mapRegion}><Polyline coordinates={routePoints} strokeColor={NAVY} strokeWidth={5}/><Marker coordinate={routePoints[0]} title=\"Origem\"/><Marker coordinate={routePoints[routePoints.length-1]} title=\"Destino\" pinColor={ORANGE}/></MapView><View style={s.sequence}><Text style={s.sequenceTitle}>Sequência das paradas</Text><Text style={s.sequenceText}>Origem · {stops.filter(Boolean).map((x,i)=>`${i+1}. ${x}`).join(' · ')}{stops.filter(Boolean).length?' · ':''}Destino</Text>{optimize&&route?.optimizedIntermediateWaypointIndex?.length?<Text style={s.optimized}>Google sugeriu otimização da ordem das paradas para esta rota.</Text>:null}</View></View>}"""
          if old6 not in s: raise SystemExit('error block marker missing')
          s=s.replace(old6,mapblock,1)
          old7="<Pressable style={[s.primary,!route&&{opacity:.5}]} onPress={save} disabled={!route}><Text style={s.primaryText}>Salvar na agenda</Text></Pressable>"
          costblock="""<View style={s.card}><Text style={s.cardTitle}>Despesas previstas</Text><Text style={s.cardSub}>O pedágio vem da rota. Acrescente outros gastos previstos antes da viagem.</Text><View style={s.costRow}><Text style={s.costLabel}>Pedágios automáticos</Text><Text style={s.costValue}>{money(route?.tollTotalBRL||0)}</Text></View>{plannedExpenses.map((x,i)=><View key={`${x.subcategory}-${i}`} style={s.costRow}><Text style={s.costLabel}>{x.subcategory}</Text><View style={{flexDirection:'row',alignItems:'center',gap:8}}><Text style={s.costValue}>{money(x.amount)}</Text><Pressable onPress={()=>setPlannedExpenses(a=>a.filter((_,n)=>n!==i))}><Text style={s.removeCost}>×</Text></Pressable></View></View>)}<View style={s.expenseAdd}><View style={s.expenseCats}>{['Alimentação','Hospedagem','Combustível','Estacionamento','Outros'].map(x=><Pressable key={x} style={[s.expenseCat,expenseCategory===x&&s.expenseCatOn]} onPress={()=>setExpenseCategory(x)}><Text style={s.expenseCatText}>{x}</Text></Pressable>)}</View><TextInput style={s.input} value={expenseValue} onChangeText={setExpenseValue} keyboardType=\"decimal-pad\" placeholder=\"Valor previsto\"/><Pressable style={s.addStop} onPress={addPlannedExpense}><Text style={s.addStopText}>+ Adicionar custo previsto</Text></Pressable></View><View style={s.costTotal}><Text style={s.costTotalLabel}>Total previsto da viagem</Text><Text style={s.costTotalValue}>{money((route?.tollTotalBRL||0)+plannedOther)}</Text></View></View>\n    <Pressable style={[s.primary,!route&&{opacity:.5}]} onPress={save} disabled={!route}><Text style={s.primaryText}>Salvar na agenda</Text></Pressable>"""
          if old7 not in s: raise SystemExit('save button marker missing')
          s=s.replace(old7,costblock,1)
          stylemarker="stopRow:{flexDirection:'row',gap:8,alignItems:'flex-end'},remove:{width:42,height:52"
          stylenew="stopRow:{flexDirection:'row',gap:8,alignItems:'flex-end'},stopTools:{flexDirection:'row',gap:6,marginTop:5},stopTool:{paddingHorizontal:9,paddingVertical:6,borderRadius:8,backgroundColor:'#EEF2F6'},stopToolText:{fontSize:9,fontWeight:'800',color:NAVY},map:{height:270,borderRadius:16},sequence:{backgroundColor:'#F4F7FB',borderRadius:12,padding:12},sequenceTitle:{fontSize:11,fontWeight:'900',color:TEXT},sequenceText:{fontSize:10,color:MUTED,lineHeight:16,marginTop:4},optimized:{fontSize:10,color:GREEN,fontWeight:'800',marginTop:5},costRow:{flexDirection:'row',justifyContent:'space-between',alignItems:'center',paddingVertical:7,borderBottomWidth:1,borderBottomColor:'#EEF2F6'},costLabel:{fontSize:11,color:TEXT,fontWeight:'700'},costValue:{fontSize:12,color:TEXT,fontWeight:'900'},removeCost:{fontSize:20,color:'#A65D44'},expenseAdd:{gap:9,marginTop:4},expenseCats:{flexDirection:'row',flexWrap:'wrap',gap:6},expenseCat:{paddingHorizontal:9,paddingVertical:7,borderRadius:9,borderWidth:1,borderColor:BORDER},expenseCatOn:{backgroundColor:'#EEF4FB',borderColor:NAVY},expenseCatText:{fontSize:9,fontWeight:'800',color:TEXT},costTotal:{backgroundColor:NAVY,borderRadius:14,padding:13,flexDirection:'row',justifyContent:'space-between',alignItems:'center'},costTotalLabel:{fontSize:11,color:'#D8E4F2',fontWeight:'800'},costTotalValue:{fontSize:17,color:'#fff',fontWeight:'900'},remove:{width:42,height:52"
          if stylemarker not in s: raise SystemExit('style marker missing')
          s=s.replace(stylemarker,stylenew,1)
          p.write_text(s)

          p=Path('mobile-rc11/src/offline.ts');s=p.read_text()
          old="export type TravelMeta = { origin: string; destination: string; stops: string[]; roundTrip: boolean; optimizeStops: boolean; distanceMeters: number; durationSeconds: number; tollBRL: number; routeLabel: string; polyline?: string | null };"
          new="export type TravelMeta = { origin: string; destination: string; stops: string[]; roundTrip: boolean; optimizeStops: boolean; distanceMeters: number; durationSeconds: number; tollBRL: number; routeLabel: string; polyline?: string | null; plannedExpenses?: Array<{category:string;subcategory:string;amount:number;description?:string}> };"
          if old not in s: raise SystemExit('travel meta marker missing')
          s=s.replace(old,new,1);p.write_text(s)

          p=Path('mobile-rc11/AppRC11Final.tsx');s=p.read_text()
          old="travel:{origin:trip.origin,destination:trip.destination,stops:trip.stops,roundTrip:trip.roundTrip,optimizeStops:trip.optimizeStops,distanceMeters:trip.distanceMeters,durationSeconds:trip.durationSeconds,tollBRL:trip.tollBRL,routeLabel:trip.routeLabel,polyline:trip.polyline}"
          new="travel:{origin:trip.origin,destination:trip.destination,stops:trip.stops,roundTrip:trip.roundTrip,optimizeStops:trip.optimizeStops,distanceMeters:trip.distanceMeters,durationSeconds:trip.durationSeconds,tollBRL:trip.tollBRL,routeLabel:trip.routeLabel,polyline:trip.polyline,plannedExpenses:trip.plannedExpenses}"
          if old not in s: raise SystemExit('agenda travel marker missing')
          s=s.replace(old,new,1);p.write_text(s)

          p=Path('mobile-rc11/src/expenses.ts');s=p.read_text()
          old="if(toll>0&&!rows.some(x=>x.id===`planned-toll-${a.id}`)){const now=new Date().toISOString();rows=[{id:`planned-toll-${a.id}`,companyId,userId,date:a.date,createdAt:now,updatedAt:now,nature:'planned',status:'draft',category:'toll',subcategory:'Pedágio',description:`Pedágio previsto · ${a.travel?.origin} → ${a.travel?.destination}`,amount:toll,currency:'BRL',paymentMethod:'corp_card',payerType:'company',tripId:a.id,receipts:[],requestedAmount:0,source:'route'},...rows];changed=true}"
          new=old+"for(const [i,e] of (a.travel?.plannedExpenses||[]).entries()){const id=`planned-extra-${a.id}-${i}`;if(Number(e.amount)>0&&!rows.some(x=>x.id===id)){const now=new Date().toISOString();rows=[{id,companyId,userId,date:a.date,createdAt:now,updatedAt:now,nature:'planned',status:'draft',category:e.category||'travel',subcategory:e.subcategory||'Outro previsto',description:e.description||`Custo previsto · ${a.travel?.origin} → ${a.travel?.destination}`,amount:Number(e.amount),currency:'BRL',paymentMethod:'corp_card',payerType:'company',tripId:a.id,receipts:[],requestedAmount:0,source:'route'},...rows];changed=true}}"
          if old not in s: raise SystemExit('planned expense marker missing')
          s=s.replace(old,new,1);p.write_text(s)
          PY
      - name: Install dependencies
        working-directory: mobile-rc11
        run: npm install --no-audit --no-fund
      - name: Expo doctor
        working-directory: mobile-rc11
        run: npx expo-doctor
      - name: TypeScript check
        working-directory: mobile-rc11
        run: npx tsc --noEmit
      - name: Expo config check
        working-directory: mobile-rc11
        run: npx expo config --type public > /tmp/config.json && grep -q 'com.movvant.enterprise' /tmp/config.json
      - name: Commit validated block
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile-rc11/src/TripPlannerScreen.tsx mobile-rc11/src/offline.ts mobile-rc11/AppRC11Final.tsx mobile-rc11/src/expenses.ts
          git commit -m 'RC11: add trip route map stop ordering and planned costs'
          git push
