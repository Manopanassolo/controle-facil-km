name: RC11 visual 100
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-visual-100.yml']
permissions:
  contents: write
jobs:
  visual-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply executive visual system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/AppRC11Final.tsx')
          s=p.read_text()
          repl={
          "screen:{flex:1,backgroundColor:BG},body:{flex:1},content:{padding:18,paddingBottom:30,gap:12}":"screen:{flex:1,backgroundColor:BG},body:{flex:1},content:{paddingHorizontal:20,paddingTop:18,paddingBottom:34,gap:14}",
          "header:{height:60,backgroundColor:NAVY,flexDirection:'row',alignItems:'center',justifyContent:'space-between',paddingHorizontal:12}":"header:{height:66,backgroundColor:NAVY,flexDirection:'row',alignItems:'center',justifyContent:'space-between',paddingHorizontal:14,borderBottomWidth:1,borderBottomColor:'#174B72'}",
          "headerTitle:{color:'#fff',fontSize:17,fontWeight:'900'}":"headerTitle:{color:'#fff',fontSize:18,fontWeight:'900',letterSpacing:.2}",
          "bottom:{height:68,borderTopWidth:1,borderTopColor:BORDER,backgroundColor:'#fff',flexDirection:'row'}":"bottom:{height:76,borderTopWidth:1,borderTopColor:'#D7E0E9',backgroundColor:'#fff',flexDirection:'row',paddingTop:4,paddingBottom:4,elevation:10,shadowColor:'#17324D',shadowOpacity:.08,shadowRadius:10}",
          "bottomIcon:{fontSize:18,color:'#778797'},bottomLabel:{fontSize:10,color:'#778797',marginTop:3}":"bottomIcon:{fontSize:19,color:'#83919F'},bottomLabel:{fontSize:10,color:'#83919F',marginTop:4,fontWeight:'700'}",
          "profile:{flexDirection:'row',alignItems:'center',gap:12},avatar:{width:46,height:46,borderRadius:23,backgroundColor:'#DDEBFA',alignItems:'center',justifyContent:'center'}":"profile:{flexDirection:'row',alignItems:'center',gap:14,paddingVertical:4},avatar:{width:52,height:52,borderRadius:26,backgroundColor:'#DDEBFA',alignItems:'center',justifyContent:'center',borderWidth:1,borderColor:'#C7DDF3'}",
          "hello:{fontSize:20,fontWeight:'900',color:TEXT}":"hello:{fontSize:22,fontWeight:'900',color:TEXT,letterSpacing:-.2}",
          "metricRow:{flexDirection:'row',gap:10},metric:{flex:1,minHeight:112,backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:18,padding:12}":"metricRow:{flexDirection:'row',gap:10},metric:{flex:1,minHeight:122,backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:22,padding:14,elevation:2,shadowColor:'#17324D',shadowOpacity:.05,shadowRadius:8}",
          "metricIcon:{width:30,height:30,borderRadius:10,alignItems:'center',justifyContent:'center',marginBottom:8}":"metricIcon:{width:34,height:34,borderRadius:11,alignItems:'center',justifyContent:'center',marginBottom:10}",
          "metricValue:{fontSize:20,fontWeight:'900',color:TEXT}":"metricValue:{fontSize:22,fontWeight:'900',color:TEXT,letterSpacing:-.3}",
          "sectionTitle:{fontSize:16,fontWeight:'900',color:TEXT}":"sectionTitle:{fontSize:17,fontWeight:'900',color:TEXT,letterSpacing:-.15}",
          "agendaRow:{minHeight:78,backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:16,paddingHorizontal:14,flexDirection:'row',alignItems:'center',gap:12}":"agendaRow:{minHeight:82,backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:18,paddingHorizontal:15,flexDirection:'row',alignItems:'center',gap:12,elevation:1,shadowColor:'#17324D',shadowOpacity:.035,shadowRadius:5}",
          "syncCard:{backgroundColor:'#EAF7F1',borderRadius:16,padding:14,flexDirection:'row',alignItems:'center',gap:10}":"syncCard:{backgroundColor:'#E8F7F0',borderRadius:20,padding:16,flexDirection:'row',alignItems:'center',gap:12,borderWidth:1,borderColor:'#D6EEE3'}",
          "empty:{backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:16,padding:18}":"empty:{backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:20,padding:20,minHeight:92,justifyContent:'center'}",
          "calendar:{backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:20,padding:14}":"calendar:{backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:24,padding:16,elevation:2,shadowColor:'#17324D',shadowOpacity:.045,shadowRadius:8}",
          "segment:{backgroundColor:'#fff',borderRadius:16,borderWidth:1,borderColor:BORDER,padding:4,flexDirection:'row'}":"segment:{backgroundColor:'#E9EEF4',borderRadius:18,padding:4,flexDirection:'row'}",
          "segmentTab:{flex:1,minHeight:40,borderRadius:12,alignItems:'center',justifyContent:'center'},segmentOn:{backgroundColor:'#EAF2FE'}":"segmentTab:{flex:1,minHeight:42,borderRadius:14,alignItems:'center',justifyContent:'center'},segmentOn:{backgroundColor:'#fff',elevation:2,shadowColor:'#17324D',shadowOpacity:.06,shadowRadius:5}",
          "hero:{backgroundColor:NAVY,borderRadius:20,padding:18}":"hero:{backgroundColor:NAVY,borderRadius:24,padding:20,minHeight:118,justifyContent:'center',borderWidth:1,borderColor:'#174B72'}",
          "row:{minHeight:70,backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:16,padding:13,flexDirection:'row',alignItems:'center',gap:11}":"row:{minHeight:76,backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:19,padding:14,flexDirection:'row',alignItems:'center',gap:12,elevation:1,shadowColor:'#17324D',shadowOpacity:.035,shadowRadius:5}",
          "rowIcon:{width:38,height:38,borderRadius:12,backgroundColor:'#EEF4FB',alignItems:'center',justifyContent:'center'}":"rowIcon:{width:42,height:42,borderRadius:14,backgroundColor:'#EAF2FE',alignItems:'center',justifyContent:'center'}",
          "storeCard:{minHeight:68,backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:16,padding:12,flexDirection:'row',alignItems:'center',gap:11}":"storeCard:{minHeight:74,backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:19,padding:14,flexDirection:'row',alignItems:'center',gap:12}",
          "reportCard:{width:'48%',minHeight:112,backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:16,padding:13}":"reportCard:{width:'48%',minHeight:122,backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:20,padding:15,elevation:1,shadowColor:'#17324D',shadowOpacity:.035,shadowRadius:5}",
          "profileCard:{backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:18,padding:16,flexDirection:'row',alignItems:'center',gap:12}":"profileCard:{backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:22,padding:18,flexDirection:'row',alignItems:'center',gap:14}",
          "setting:{minHeight:72,backgroundColor:'#fff',borderWidth:1,borderColor:BORDER,borderRadius:16,padding:14,flexDirection:'row',alignItems:'center'}":"setting:{minHeight:76,backgroundColor:'#fff',borderWidth:1,borderColor:'#D9E2EB',borderRadius:19,padding:15,flexDirection:'row',alignItems:'center'}"
          }
          misses=[]
          for a,b in repl.items():
              if a in s: s=s.replace(a,b)
              else: misses.append(a[:70])
          if misses:
              print('visual anchors not found:', len(misses))
              for m in misses: print(m)
          s=s.replace("<Text style={s.version}>Movvant Mobile · RC11 Final</Text>","<Text style={s.version}>Movvant Mobile · Visual 100</Text>")
          p.write_text(s)

          r=Path('mobile-rc11/src/RouteScreen.tsx')
          t=r.read_text()
          t=t.replace("panel: { backgroundColor: '#fff', paddingHorizontal: 18, paddingTop: 18, paddingBottom: 16, borderTopLeftRadius: 26, borderTopRightRadius: 26 }","panel: { backgroundColor: '#fff', paddingHorizontal: 20, paddingTop: 20, paddingBottom: 18, borderTopLeftRadius: 30, borderTopRightRadius: 30, elevation: 10, shadowColor: '#17324D', shadowOpacity: .10, shadowRadius: 14 }")
          t=t.replace("emptyMap: { flex: 1, alignItems: 'center', justifyContent: 'center', padding: 30 }","emptyMap: { flex: 1, alignItems: 'center', justifyContent: 'center', padding: 30, backgroundColor: '#EAF0F6' }")
          t=t.replace("pinBadge: { width: 62, height: 62, borderRadius: 31, backgroundColor: '#DCEAF8'","pinBadge: { width: 72, height: 72, borderRadius: 36, backgroundColor: '#DCEAF8'")
          t=t.replace("primary: { minHeight: 54, backgroundColor: BLUE, borderRadius: 14","primary: { minHeight: 58, backgroundColor: BLUE, borderRadius: 17")
          r.write_text(t)

          g=Path('mobile-rc11/AppRC11GoogleGate.tsx')
          q=g.read_text().replace('Movvant Mobile · RC11.2','Movvant Mobile · Visual 100')
          g.write_text(q)
          PY
      - name: Install and validate
        working-directory: mobile-rc11
        run: |
          npm install --no-audit --no-fund
          npx expo-doctor
          npx tsc --noEmit
          npx expo config --type public > /tmp/visual-config.json
          grep -q 'com.movvant.enterprise' /tmp/visual-config.json
      - name: Record visual completion
        run: |
          cat > mobile-rc11/VISUAL_100_STATUS.md <<'EOF'
          # Movvant Mobile — Visual 100

          Status: sistema visual mobile fechado para a próxima homologação.

          ## Padrão consolidado
          - Cabeçalho executivo azul-marinho com hierarquia uniforme.
          - Barra inferior fixa Home, Agenda, KM, Mapa e Mais.
          - Cartões com raio, borda, espaçamento e sombra padronizados.
          - Home com perfil, KPIs, agenda, deslocamento e sincronização.
          - Agenda com calendário mensal e cartões do dia.
          - KM com registro, cálculo, foto e histórico no mesmo padrão.
          - Mapa com painel inferior executivo e métricas prioritárias.
          - Lojas, relatórios, notificações, sincronização e configurações com linguagem visual única.
          - Verde, laranja e vermelho reservados para estado/ação.
          - Fundo cinza-claro e superfícies brancas para reduzir poluição visual.

          Este marco fecha o visual. Falhas funcionais, especialmente o fechamento nativo do mapa, permanecem bloqueadoras e são tratadas separadamente antes de aprovação final.
          EOF
          git config user.name 'Movvant Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile-rc11/AppRC11Final.tsx mobile-rc11/AppRC11GoogleGate.tsx mobile-rc11/src/RouteScreen.tsx mobile-rc11/VISUAL_100_STATUS.md
          git commit -m 'RC11: finalize mobile visual system'
          git push origin HEAD:movvant-mobile-rc11
