name: RC11 final polish

on:
  push:
    branches: [movvant-mobile-rc11]
    paths:
      - '.github/workflows/rc11-final-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final runtime safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/AppRC11Final.tsx')
          s=p.read_text()
          s=s.replace("import React, { useCallback, useEffect, useMemo, useState } from 'react';", "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react';")
          old="  const [session,setSession] = useState<Session|null>(null); const [boot,setBoot] = useState(true); const [data,setData] = useState<BootstrapData|null>(null); const [local,setLocal] = useState<LocalState>({ appointments:[],km:[],trips:[] }); const [online,setOnline] = useState(true); const [pending,setPending] = useState(0); const [syncing,setSyncing] = useState(false); const [prefs,setPrefs] = useState<Preferences>(DEFAULT_PREFS); const [tab,setTab] = useState<Tab>('home'); const [more,setMore] = useState<MorePage>('menu'); const [drawer,setDrawer] = useState(false);"
          new=old+"\n  const lastAutoSyncAttempt = useRef(0);"
          if old not in s: raise SystemExit('state target missing')
          s=s.replace(old,new,1)
          old2="  useEffect(() => { if (online && prefs.autoSync && session && data?.companyId && pending > 0) sync(); }, [online,prefs.autoSync,session,data?.companyId,pending]);"
          new2="  useEffect(() => { if (!online || !prefs.autoSync || !session || !data?.companyId || pending <= 0 || syncing) return; const now = Date.now(); if (now - lastAutoSyncAttempt.current < 15000) return; lastAutoSyncAttempt.current = now; sync(); }, [online,prefs.autoSync,session,data?.companyId,pending,syncing,sync]);"
          if old2 not in s: raise SystemExit('autosync target missing')
          s=s.replace(old2,new2,1)
          s=s.replace("new Date(x.finishedAt).toISOString().slice(0,10) === todayKey", "isoDate(new Date(x.finishedAt)) === todayKey")
          p.write_text(s)
          PY
      - name: Commit polish
        run: |
          git config user.name 'Movvant Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile-rc11/AppRC11Final.tsx
          git commit -m 'RC11 final: guard automatic sync retries and local date metrics'
          git push origin HEAD:movvant-mobile-rc11
