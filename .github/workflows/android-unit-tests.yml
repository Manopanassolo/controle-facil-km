name: Testes Android — Controle Fácil KM

on:
  push:
    branches:
      - controle-facil-km-v1
      - controle-facil-km-v1-google-calendar-tests
  pull_request:
    branches:
      - controle-facil-km-v1

jobs:
  testes-unitarios:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Executar testes unitários
        working-directory: android
        run: |
          gradle :app:testDebugUnitTest --no-build-cache --rerun-tasks

      - name: Exibir relatório XML
        if: always()
        working-directory: android
        run: |
          find app/build/test-results -type f -name "*.xml" -print || true
