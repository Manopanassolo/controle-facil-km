name: RC11 temporary autofix

on:
  push:
    branches: [movvant-mobile-rc11]
    paths:
      - '.github/workflows/rc11-autofix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace deprecated StyleSheet property
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/AppRC11.tsx')
          s=p.read_text()
          old="drawerOverlay:{...StyleSheet.absoluteFillObject,zIndex:99,flexDirection:'row'}"
          new="drawerOverlay:{position:'absolute',top:0,right:0,bottom:0,left:0,zIndex:99,flexDirection:'row'}"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          git config user.name 'Movvant Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile-rc11/AppRC11.tsx
          git commit -m 'RC11.1: replace absoluteFillObject with explicit overlay bounds'
          git push origin HEAD:movvant-mobile-rc11
