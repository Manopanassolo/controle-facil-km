name: RC11 UX routes fixes v2
on:
  push:
    branches: [movvant-mobile-rc11]
    paths:
      - mobile-rc11/UX_FIX_RUN
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch UX routes calendar money edit reminder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/src/TripPlannerScreen.tsx'); s=p.read_text()
          s=s.replace("type RouteOption={index:number;distanceMeters:number;duration?:string|null;polyline?:string|null;tollTotalBRL:number;hasTolls:boolean;hasFerry:boolean;optimizedIntermediateWaypointIndex?:number[]};","type RouteOption={index:number;strategy?:string;strategyLabel?:string;distanceMeters:number;duration?:string|null;polyline?:string|null;returnPolyline?:string|null;tollTotalBRL:number;hasTolls:boolean;hasFerry:boolean;optimizedIntermediateWaypointIndex?:number[]};")
          s=s.replace("export type PlannedTrip={date:string;time:string;origin:string;destination:string;stops:string[];roundTrip:boolean;optimizeStops:boolean;distanceMeters:number;durationSeconds:number;tollBRL:number;routeLabel:string;polyline?:string|null;plannedExpenses?:PlannedExpenseDraft[]};","export type PlannedTrip={date:string;time:string;origin:string;destination:string;stops:string[];roundTrip:boolean;optimizeStops:boolean;distanceMeters:number;durationSeconds:number;tollBRL:number;routeLabel:string;polyline?:string|null;returnPolyline?:string|null;plannedExpenses?:PlannedExpenseDraft[]};")
          s=s.replace("type Props={visible:boolean;customers:CustomerRow[];initialDate:string;onClose:()=>void;onSave:(trip:PlannedTrip)=>Promise<void>};","type Props={visible:boolean;customers:CustomerRow[];initialDate:string;initialTrip?:PlannedTrip|null;onClose:()=>void;onSave:(trip:PlannedTrip)=>Promise<void>};")
          s=s.replace("export default function TripPlannerScreen({visible,customers,initialDate,onClose,onSave}:Props){","export default function TripPlannerScreen({visible,customers,initialDate,initialTrip,onClose,onSave}:Props){")
          old="const [date,setDate]=useState(initialDate),[time,setTime]=useState('08:00'),[origin,setOrigin]=useState(''),[destination,setDestination]=useState(''),[stops,setStops]=useState<string[]>([]),[roundTrip,setRoundTrip]=useState(false),[optimize,setOptimize]=useState(true),[loading,setLoading]=useState(false),[routes,setRoutes]=useState<RouteOption[]>([]),[selected,setSelected]=useState(0),[error,setError]=useState(''),[plannedExpenses,setPlannedExpenses]=useState<PlannedExpenseDraft[]>([]),[expenseCategory,setExpenseCategory]=useState('Alimentação'),[expenseValue,setExpenseValue]=useState('');\n  useEffect(()=>{if(visible){setDate(initialDate);setError('')}},[visible,initialDate]);"
          new="const [date,setDate]=useState(initialDate),[time,setTime]=useState('08:00'),[origin,setOrigin]=useState(''),[destination,setDestination]=useState(''),[stops,setStops]=useState<string[]>([]),[roundTrip,setRoundTrip]=useState(false),[optimize,setOptimize]=useState(true),[loading,setLoading]=useState(false),[routes,setRoutes]=useState<RouteOption[]>([]),[selected,setSelected]=useState(0),[error,setError]=useState(''),[plannedExpenses,setPlannedExpenses]=useState<PlannedExpenseDraft[]>([]),[expenseCategory,setExpenseCategory]=useState('Alimentação'),[expenseValue,setExpenseValue]=useState(''),[savedNotice,setSavedNotice]=useState(false),[calendarOpen,setCalendarOpen]=useState(false),[calendarCursor,setCalendarCursor]=useState(new Date(initialDate+'T12:00:00'));\n  useEffect(()=>{if(visible){const t=initialTrip;setDate(t?.date||initialDate);setTime(t?.time||'08:00');setOrigin(t?.origin||'');setDestination(t?.destination||'');setStops(t?.stops||[]);setRoundTrip(Boolean(t?.roundTrip));setOptimize(t?.optimizeStops??true);setPlannedExpenses(t?.plannedExpenses||[]);setRoutes(t?[{index:0,strategyLabel:t.routeLabel,distanceMeters:t.distanceMeters,duration:`${t.durationSeconds}s`,polyline:t.polyline,returnPolyline:t.returnPolyline,tollTotalBRL:t.tollBRL,hasTolls:t.tollBRL>0,hasFerry:false}]:[]);setSelected(0);setCalendarCursor(new Date((t?.date||initialDate)+'T12:00:00'));setError('')}},[visible,initialDate,initialTrip]);"
          assert old in s; s=s.replace(old,new)
          s=s.replace("const addStop=()=>setStops(v=>[...v,'']);", "const moneyMask=(raw:string)=>{const d=raw.replace(/\\D/g,'');return d?(Number(d)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''}; const parseMoney=(raw:string)=>Number(raw.replace(/\\./g,'').replace(',','.'))||0;\n  const addStop=()=>setStops(v=>[...v,'']);")
          s=s.replace("const v=Number(expenseValue.replace(',','.'));","const v=parseMoney(expenseValue);")
          oldc="const compute=async()=>{if(!origin.trim()||!destination.trim()){setError('Informe ponto de partida e destino.');return}setLoading(true);setError('');try{const body={origin,destination,stops:stops.filter(Boolean),optimize};const r=await fetch(`${API_BASE}/api/routes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j?.error||'Não foi possível calcular a rota.');let items=(j?.items||[]) as RouteOption[];if(roundTrip)items=items.map(x=>({...x,distanceMeters:x.distanceMeters*2,duration:`${seconds(x.duration)*2}s`,tollTotalBRL:(x.tollTotalBRL||0)*2}));setRoutes(items);setSelected(0);if(!items.length)setError('Nenhuma rota disponível para os pontos informados.')}catch(e){setError(e instanceof Error?e.message:'Falha ao calcular rota.')}finally{setLoading(false)}};"
          newc="const compute=async()=>{if(!origin.trim()||!destination.trim()){setError('Informe ponto de partida e destino.');return}setLoading(true);setError('');try{const request=async(body:any)=>{const r=await fetch(`${API_BASE}/api/routes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,strategy:'all'})});const j=await r.json();if(!r.ok)throw new Error(j?.error||'Não foi possível calcular a rota.');return (j?.items||[]) as RouteOption[]};let items=await request({origin,destination,stops:stops.filter(Boolean),optimize});if(roundTrip){const back=await request({origin:destination,destination:origin,stops:stops.filter(Boolean).slice().reverse(),optimize:false});items=items.map((x,i)=>{const b=back.find(q=>q.strategy===x.strategy)||back[i]||back[0];return {...x,distanceMeters:x.distanceMeters+(b?.distanceMeters||0),duration:`${seconds(x.duration)+seconds(b?.duration)}s`,tollTotalBRL:(x.tollTotalBRL||0)+(b?.tollTotalBRL||0),returnPolyline:b?.polyline||null}})}setRoutes(items);setSelected(0);if(!items.length)setError('Nenhuma rota disponível para os pontos informados.')}catch(e){setError(e instanceof Error?e.message:'Falha ao calcular rota.')}finally{setLoading(false)}};"
          assert oldc in s; s=s.replace(oldc,newc)
          s=s.replace("const routePoints=decodePolyline(route?.polyline);const mapRegion=regionFor(routePoints);","const routePoints=decodePolyline(route?.polyline),returnPoints=decodePolyline(route?.returnPolyline);const mapRegion=regionFor([...routePoints,...returnPoints]);")
          olds="const save=async()=>{if(!route){setError('Calcule e selecione uma rota antes de salvar.');return}await onSave({date,time,origin:origin.trim(),destination:destination.trim(),stops:stops.filter(Boolean),roundTrip,optimizeStops:optimize,distanceMeters:route.distanceMeters,durationSeconds:seconds(route.duration),tollBRL:route.tollTotalBRL||0,routeLabel:`Rota ${selected+1}`,polyline:route.polyline,plannedExpenses});Alert.alert('Viagem salva na Agenda',`${date} · ${time} · ${km(route.distanceMeters)} km planejados.`);onClose()};"
          news="const save=async()=>{if(!route){setError('Calcule e selecione uma rota antes de salvar.');return}await onSave({date,time,origin:origin.trim(),destination:destination.trim(),stops:stops.filter(Boolean),roundTrip,optimizeStops:optimize,distanceMeters:route.distanceMeters,durationSeconds:seconds(route.duration),tollBRL:route.tollTotalBRL||0,routeLabel:route.strategyLabel||`Rota ${selected+1}`,polyline:route.polyline,returnPolyline:route.returnPolyline,plannedExpenses});setSavedNotice(true)};"
          assert olds in s; s=s.replace(olds,news)
          s=s.replace('<TextInput value={date} onChangeText={setDate} style={s.input} placeholder="AAAA-MM-DD"/>','<Pressable style={s.input} onPress={()=>setCalendarOpen(true)}><Text style={{color:TEXT,paddingTop:15}}>{new Date(date+\'T12:00:00\').toLocaleDateString(\'pt-BR\')}</Text></Pressable>')
          oldmap='<MapView key={`${selected}-${routePoints.length}`} style={s.map} initialRegion={mapRegion}><Polyline coordinates={routePoints} strokeColor={NAVY} strokeWidth={5}/><Marker coordinate={routePoints[0]} title="Origem"/><Marker coordinate={routePoints[routePoints.length-1]} title="Destino" pinColor={ORANGE}/></MapView>'
          newmap='<MapView key={`${selected}-${routePoints.length}-${returnPoints.length}`} style={s.map} initialRegion={mapRegion} mapType="standard"><Polyline coordinates={routePoints} strokeColor={BLUE} strokeWidth={5}/>{returnPoints.length>1?<Polyline coordinates={returnPoints} strokeColor={ORANGE} strokeWidth={5}/>:null}<Marker coordinate={routePoints[0]} title="Origem"/><Marker coordinate={routePoints[routePoints.length-1]} title="Destino" pinColor={ORANGE}/></MapView>'
          assert oldmap in s; s=s.replace(oldmap,newmap)
          s=s.replace('<Text style={s.routeTitle}>Rota {i+1}{r.hasFerry?\' · inclui balsa\':\'\'}</Text>','<Text style={s.routeTitle}>{r.strategyLabel||`Rota ${i+1}`}{r.hasFerry?\' · inclui balsa\':\'\'}</Text>')
          s=s.replace('value={expenseValue} onChangeText={setExpenseValue} keyboardType="decimal-pad" placeholder="Valor previsto"','value={expenseValue} onChangeText={v=>setExpenseValue(moneyMask(v))} keyboardType="decimal-pad" placeholder="0,00"')
          marker='    <Pressable style={[s.primary,!route&&{opacity:.5}]} onPress={save}'
          i=s.find(marker); assert i!=-1
          modal='''    <Modal visible={calendarOpen} transparent animationType="fade" onRequestClose={()=>setCalendarOpen(false)}><View style={{flex:1,backgroundColor:'rgba(0,0,0,.35)',justifyContent:'center',padding:24}}><View style={{backgroundColor:'#fff',borderRadius:24,padding:18}}><View style={{flexDirection:'row',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><Pressable onPress={()=>setCalendarCursor(new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1))}><Text style={{fontSize:28,color:NAVY}}>‹</Text></Pressable><Text style={{fontWeight:'900',color:TEXT,fontSize:16}}>{calendarCursor.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</Text><Pressable onPress={()=>setCalendarCursor(new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1))}><Text style={{fontSize:28,color:NAVY}}>›</Text></Pressable></View><View style={{flexDirection:'row',flexWrap:'wrap'}}>{Array.from({length:new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1).getDay()+new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,0).getDate()},(_,i)=>{const f=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1).getDay();if(i<f)return <View key={'e'+i} style={{width:'14.285%',height:42}}/>;const d=i-f+1,iso=`${calendarCursor.getFullYear()}-${String(calendarCursor.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;return <Pressable key={iso} style={{width:'14.285%',height:42,alignItems:'center',justifyContent:'center'}} onPress={()=>{setDate(iso);setCalendarOpen(false)}}><View style={[{width:34,height:34,borderRadius:17,alignItems:'center',justifyContent:'center'},date===iso&&{backgroundColor:BLUE}]}><Text style={{color:date===iso?'#fff':TEXT}}>{d}</Text></View></Pressable>})}</View></View></View></Modal>\n    <Modal visible={savedNotice} transparent animationType="fade" onRequestClose={()=>setSavedNotice(false)}><View style={{flex:1,backgroundColor:'rgba(11,53,88,.35)',justifyContent:'center',padding:24}}><View style={{backgroundColor:'#fff',borderRadius:24,padding:22,gap:10}}><Text style={{fontSize:20,fontWeight:'900',color:NAVY}}>Viagem salva na Agenda</Text><Text style={{fontSize:13,color:MUTED}}>{new Date(date+'T12:00:00').toLocaleDateString('pt-BR')} · {time} · {route?km(route.distanceMeters):'0,0'} km planejados.</Text><Pressable style={s.primary} onPress={()=>{setSavedNotice(false);onClose()}}><Text style={s.primaryText}>Concluir</Text></Pressable></View></View></Modal>\n'''
          s=s[:i]+modal+s[i:]; p.write_text(s)
          p=Path('mobile-rc11/src/offline.ts'); s=p.read_text().replace('polyline?: string | null; plannedExpenses?','polyline?: string | null; returnPolyline?: string | null; plannedExpenses?'); p.write_text(s)
          p=Path('mobile-rc11/src/ExpensesScreen.tsx'); s=p.read_text(); s=s.replace("const money=(v:number)=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const iso=()=>new Date().toISOString().slice(0,10);","const money=(v:number)=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const moneyMask=(raw:string)=>{const d=raw.replace(/\\D/g,'');return d?(Number(d)/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):''};const parseMoney=(raw:string)=>Number(raw.replace(/\\./g,'').replace(',','.'))||0;const iso=()=>new Date().toISOString().slice(0,10);"); s=s.replace("const save=async()=>{const v=Number(amount.replace(',','.'));","const save=async()=>{const v=parseMoney(amount);"); s=s.replace('value={amount} onChangeText={setAmount} keyboardType="decimal-pad" placeholder="0,00"','value={amount} onChangeText={v=>setAmount(moneyMask(v))} keyboardType="decimal-pad" placeholder="0,00"'); p.write_text(s)
          p=Path('mobile-rc11/AppRC11Final.tsx'); s=p.read_text(); s=s.replace("import * as ImagePicker from 'expo-image-picker';","import * as ImagePicker from 'expo-image-picker';\nimport * as Notifications from 'expo-notifications';"); s=s.replace("import { Alert, Image, Modal, Pressable, SafeAreaView, ScrollView, Share, StatusBar, StyleSheet, Switch, Text, TextInput, View } from 'react-native';","import { Alert, Image, Modal, Platform, Pressable, SafeAreaView, ScrollView, Share, StatusBar, StyleSheet, Switch, Text, TextInput, View } from 'react-native';")
          ins="\nasync function scheduleTripEndReminder(date:string,title:string){try{const permission=await Notifications.requestPermissionsAsync();if(permission.status!=='granted')return;if(Platform.OS==='android')await Notifications.setNotificationChannelAsync('trip-reminders',{name:'Viagens',importance:Notifications.AndroidImportance.DEFAULT});const when=new Date(`${date}T20:00:00`);if(when.getTime()<=Date.now())return;await Notifications.scheduleNotificationAsync({content:{title:'Finalizar viagem do dia',body:`Revise e finalize: ${title}`,sound:true},trigger:when as any});}catch{}}\n"
          s=s.replace('async function savePrefs(p: Preferences) {',ins+'\nasync function savePrefs(p: Preferences) {')
          s=s.replace("const [tripPlanner,setTripPlanner]=useState(false);","const [tripPlanner,setTripPlanner]=useState(false);\n  const [editingTrip,setEditingTrip]=useState<Appointment|null>(null);")
          s=s.replace("const openItem=(item:Appointment)=>{setEditing(item);setTitle(item.title);setTime(item.time);setCustomer(customers.find(c=>c.id===item.customerId)||null);setOpen(true);};","const openItem=(item:Appointment)=>{if(item.type==='Viagem'&&item.travel){setEditingTrip(item);setTripPlanner(true);return}setEditing(item);setTitle(item.title);setTime(item.time);setCustomer(customers.find(c=>c.id===item.customerId)||null);setOpen(true);};")
          old="const saveTrip=async(trip:PlannedTrip)=>{const item:LocalAppointment={id:`${Date.now()}-travel`,date:trip.date,time:trip.time,title:`Viagem · ${trip.origin} → ${trip.destination}`,store:trip.destination,type:'Viagem',synced:false,travel:{origin:trip.origin,destination:trip.destination,stops:trip.stops,roundTrip:trip.roundTrip,optimizeStops:trip.optimizeStops,distanceMeters:trip.distanceMeters,durationSeconds:trip.durationSeconds,tollBRL:trip.tollBRL,routeLabel:trip.routeLabel,polyline:trip.polyline,plannedExpenses:trip.plannedExpenses}};await onSaveTravel(item);setSelected(trip.date);setCursor(new Date(`${trip.date}T12:00:00`));};"
          new="const saveTrip=async(trip:PlannedTrip)=>{const item:LocalAppointment={id:editingTrip?.id||`${Date.now()}-travel`,date:trip.date,time:trip.time,title:`Viagem · ${trip.origin} → ${trip.destination}`,store:trip.destination,type:'Viagem',synced:false,travel:{origin:trip.origin,destination:trip.destination,stops:trip.stops,roundTrip:trip.roundTrip,optimizeStops:trip.optimizeStops,distanceMeters:trip.distanceMeters,durationSeconds:trip.durationSeconds,tollBRL:trip.tollBRL,routeLabel:trip.routeLabel,polyline:trip.polyline,returnPolyline:trip.returnPolyline,plannedExpenses:trip.plannedExpenses}};await onSaveTravel(item);await scheduleTripEndReminder(trip.date,item.title);setSelected(trip.date);setCursor(new Date(`${trip.date}T12:00:00`));setEditingTrip(null);};"
          assert old in s; s=s.replace(old,new)
          s=s.replace('<Pressable style={s.tripAgendaButton} onPress={()=>setTripPlanner(true)}>','<Pressable style={s.tripAgendaButton} onPress={()=>{setEditingTrip(null);setTripPlanner(true)}}>')
          s=s.replace('<TripPlannerScreen visible={tripPlanner} customers={customers} initialDate={selected} onClose={()=>setTripPlanner(false)} onSave={saveTrip}/>','<TripPlannerScreen visible={tripPlanner} customers={customers} initialDate={selected} initialTrip={editingTrip?.travel?{date:editingTrip.date,time:editingTrip.time,...editingTrip.travel}:null} onClose={()=>{setTripPlanner(false);setEditingTrip(null)}} onSave={saveTrip}/>')
          s=s.replace('<View style={s.managementHero}><Text style={s.agendaEyebrow}>VISÃO GERENCIAL</Text><Text style={s.managementTitle}>Operação em números</Text><Text style={s.managementText}>Acompanhe deslocamentos, KM, visitas e indicadores comerciais do período.</Text></View>','<View style={s.managementHero}><Text style={s.agendaEyebrow}>VISÃO GERENCIAL</Text><Text style={s.managementTitle}>Resumo do período</Text><Text style={s.managementText}>Veja primeiro o que aconteceu no período e depois compare planejamento, execução e despesas.</Text></View>')
          p.write_text(s)
          PY
      - name: Install and validate
        working-directory: mobile-rc11
        run: |
          npm ci
          npx expo install expo-notifications
          npx expo-doctor
          npx tsc --noEmit
          npx expo config --type public >/dev/null
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile-rc11 api/routes.js
          git commit -m "RC11: fix route UX calendar money editing and reminders"
          git push origin movvant-mobile-rc11
