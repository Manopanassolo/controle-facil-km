name: RC11 integrated visual-functional recovery

on:
  push:
    branches: [movvant-mobile-rc11]
    paths:
      - '.github/workflows/rc11-functional-recovery.yml'
      - '.github/scripts/rc11_functional_recovery.py'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply integrated recovery
        run: python3 .github/scripts/rc11_functional_recovery.py
      - name: Validate mobile
        working-directory: mobile-rc11
        run: |
          npm install --no-audit --no-fund
          npx expo-doctor
          npx tsc --noEmit
          npx expo config --type public > /tmp/rc11-integrated.json
          grep -q 'com.movvant.enterprise' /tmp/rc11-integrated.json
      - name: Commit integrated recovery
        run: |
          git config user.name 'Movvant Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add mobile-rc11/src/RouteScreen.tsx mobile-rc11/src/offline.ts mobile-rc11/AppRC11Final.tsx mobile-rc11/INTEGRATED_RECOVERY_STATUS.md
          git commit -m 'RC11: integrate visual and functional recovery'
          git push origin HEAD:movvant-mobile-rc11
