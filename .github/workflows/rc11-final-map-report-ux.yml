name: RC11 final map report UX
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['mobile-rc11/RC11_FINAL_UX_TRIGGER']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: movvant-mobile-rc11}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - name: Apply final RC11 experience block
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/src/TripPlannerScreen.tsx'); s=p.read_text()
          s=s.replace("import React, { useEffect, useMemo, useRef, useState } from 'react';","import React, { useEffect, useMemo, useRef, useState } from 'react';\nimport AsyncStorage from '@react-native-async-storage/async-storage';\nimport * as Location from 'expo-location';")
          s=s.replace("import { Alert, Linking, Modal, Pressable, SafeAreaView, ScrollView, StatusBar, StyleSheet, Switch, Text, TextInput, View } from 'react-native';","import { Alert, Linking, Modal, Pressable, SafeAreaView, ScrollView, StatusBar, StyleSheet, Switch, Text, TextInput, View, useWindowDimensions } from 'react-native';")
          s=s.replace("type Props={visible:boolean;customers:CustomerRow[];initialDate:string;initialTrip?:PlannedTrip|null;onClose:()=>void;onSave:(trip:PlannedTrip)=>Promise<void>};","type Props={visible:boolean;customers:CustomerRow[];initialDate:string;initialTrip?:PlannedTrip|null;userId?:string;onClose:()=>void;onSave:(trip:PlannedTrip)=>Promise<void>};")
          s=s.replace("export default function TripPlannerScreen({visible,customers,initialDate,initialTrip,onClose,onSave}:Props){","export default function TripPlannerScreen({visible,customers,initialDate,initialTrip,userId,onClose,onSave}:Props){\n  const {height:screenHeight}=useWindowDimensions();\n  const mapHeight=Math.max(300,Math.min(520,Math.round(screenHeight*0.46)));\n  const [favoriteOrigins,setFavoriteOrigins]=useState<Array<{label:string,address:string}>>([]),[approvedIndex,setApprovedIndex]=useState<number|null>(initialTrip?0:null),[locating,setLocating]=useState(false);")
          s=s.replace("setRoutes(t?[{index:0,strategyLabel:t.routeLabel,distanceMeters:t.distanceMeters,duration:`${t.durationSeconds}s`,polyline:t.polyline,returnPolyline:t.returnPolyline,tollTotalBRL:t.tollBRL,hasTolls:t.tollBRL>0,hasFerry:false}]:[]);setSelected(0);", "setRoutes(t?[{index:0,strategyLabel:t.routeLabel,distanceMeters:t.distanceMeters,duration:`${t.durationSeconds}s`,polyline:t.polyline,returnPolyline:t.returnPolyline,tollTotalBRL:t.tollBRL,hasTolls:t.tollBRL>0,hasFerry:false}]:[]);setSelected(0);setApprovedIndex(t?0:null);")
          anchor="  const moneyMask=(raw:string)=>"
          extra="  useEffect(()=>{if(!visible||!userId)return;AsyncStorage.getItem(`movvant.rc11.favoriteOrigins.${userId}`).then(raw=>{try{const x=raw?JSON.parse(raw):[];setFavoriteOrigins(Array.isArray(x)?x:[])}catch{setFavoriteOrigins([])}})},[visible,userId]);\n  const useCurrentLocation=async()=>{setLocating(true);try{const perm=await Location.requestForegroundPermissionsAsync();if(perm.status!=='granted'){setError('Permita o acesso à localização para usar sua posição atual.');return}const pos=await Location.getCurrentPositionAsync({accuracy:Location.Accuracy.High});let text=`${pos.coords.latitude},${pos.coords.longitude}`;try{const g=await Location.reverseGeocodeAsync(pos.coords);const a=g[0];if(a)text=[a.street,a.streetNumber,a.district,a.city,a.region].filter(Boolean).join(', ')||text}catch{}setOrigin(text);setRoutes([]);setApprovedIndex(null)}catch{setError('Não foi possível obter sua localização atual.')}finally{setLocating(false)}};\n"
          if extra not in s: s=s.replace(anchor,extra+anchor)
          s=s.replace("setRoutes(items);setSelected(0);if(!items.length)","setRoutes(items);setSelected(0);setApprovedIndex(null);if(!items.length)")
          s=s.replace("const save=async()=>{if(!route){setError('Calcule e selecione uma rota antes de salvar.');return}","const save=async()=>{if(!route){setError('Calcule e selecione uma rota antes de salvar.');return}if(approvedIndex!==selected){setError('Confirme o percurso escolhido em “Usar este percurso”.');return}")
          s=s.replace('<ScrollView contentContainerStyle={s.content} keyboardShouldPersistTaps="handled">','<ScrollView contentContainerStyle={s.content} keyboardShouldPersistTaps="handled" automaticallyAdjustKeyboardInsets>')
          old='<View style={s.card}><Text style={s.cardTitle}>Planejar rota</Text><Text style={s.cardSub}>Autocomplete, múltiplas paradas e cálculo automático.</Text><PlaceField label="Ponto de partida" value={origin} onChange={setOrigin} customers={customers}/>'
          new='<View style={s.card}><Text style={s.cardTitle}>Planejar rota</Text><Text style={s.cardSub}>Autocomplete, múltiplas paradas e cálculo automático.</Text><View style={s.originQuick}><Pressable style={s.originQuickBtn} onPress={useCurrentLocation}><Text style={s.originQuickText}>{locating?"Localizando...":"⌖ Minha localização atual"}</Text></Pressable>{favoriteOrigins.filter(x=>x.address.trim()).map((x,i)=><Pressable key={i} style={s.originQuickBtn} onPress={()=>{setOrigin(x.address);setRoutes([]);setApprovedIndex(null)}}><Text style={s.originQuickText}>{x.label||`Favorito ${i+1}`}</Text><Text style={s.originQuickSub} numberOfLines={1}>{x.address}</Text></Pressable>)}</View><PlaceField label="Ponto de partida" value={origin} onChange={v=>{setOrigin(v);setRoutes([]);setApprovedIndex(null)}} customers={customers}/>'
          s=s.replace(old,new)
          oldmap='<MapView key={`${selected}-${routePoints.length}-${returnPoints.length}`} style={s.map} initialRegion={mapRegion} mapType="standard" customMapStyle={LIGHT_MAP_STYLE}><Polyline coordinates={routePoints} strokeColor={BLUE} strokeWidth={5}/>'
          newmap='<MapView key={`${routes.length}-${routePoints.length}-${returnPoints.length}`} style={[s.map,{height:mapHeight}]} initialRegion={mapRegion} mapType="standard" customMapStyle={LIGHT_MAP_STYLE}>{routes.map((r,i)=>{const pts=decodePolyline(r.polyline);return pts.length>1?<Polyline key={`alt-${i}`} coordinates={pts} strokeColor={i===selected?BLUE:"#9AA9B8"} strokeWidth={i===selected?7:4} tappable onPress={()=>{setSelected(i);setApprovedIndex(null)}} zIndex={i===selected?10:1}/>:null})}'
          s=s.replace(oldmap,newmap)
          s=s.replace('Mapa da rota selecionada</Text><Text style={s.cardSub}>Toque em outra rota abaixo para comparar o caminho no mapa.','Escolha o trajeto no mapa</Text><Text style={s.cardSub}>Todas as alternativas aparecem juntas. Toque em uma linha ou nos cartões para selecionar.')
          s=s.replace('onPress={()=>setSelected(i)}><View>','onPress={()=>{setSelected(i);setApprovedIndex(null)}}><View>')
          select_end='{route&&<View style={s.summary}>'
          approve='<Pressable style={[s.primary,approvedIndex===selected&&{backgroundColor:GREEN}]} onPress={()=>{setApprovedIndex(selected);setError(\'\')}}><Text style={s.primaryText}>{approvedIndex===selected?\'✓ Percurso aprovado\':\'Usar este percurso\'}</Text></Pressable>'
          if approve not in s: s=s.replace(select_end,approve+select_end)
          s=s.replace("map:{height:270,borderRadius:16},","map:{minHeight:300,borderRadius:16},originQuick:{gap:8},originQuickBtn:{borderWidth:1,borderColor:BORDER,borderRadius:12,paddingHorizontal:12,paddingVertical:10,backgroundColor:'#F7FAFD'},originQuickText:{fontSize:12,fontWeight:'900',color:NAVY},originQuickSub:{fontSize:10,color:MUTED,marginTop:2},")
          p.write_text(s)

          p=Path('mobile-rc11/AppRC11Final.tsx'); s=p.read_text()
          s=s.replace("function Header({ title, onMenu, onBack, unread }: { title: string; onMenu: () => void; onBack?: () => void; unread: number }) { return <View style={s.header}><Pressable style={s.headerBtn} onPress={onBack || onMenu}><Text style={s.headerBtnText}>{onBack ? '‹' : '☰'}</Text></Pressable><Text style={s.headerTitle}>{title}</Text><View style={s.headerRight}>{unread > 0 && <View style={s.unreadBadge}><Text style={s.unreadText}>{unread > 99 ? '99+' : unread}</Text></View>}<Text style={s.headerBell}>●</Text></View></View>; }", "function Header({ title, onMenu, onBack, unread, onNotifications }: { title: string; onMenu: () => void; onBack?: () => void; unread: number; onNotifications?:()=>void }) { return <View style={s.header}><Pressable style={s.headerBtn} onPress={onBack || onMenu}><Text style={s.headerBtnText}>{onBack ? '‹' : '☰'}</Text></Pressable><Text style={s.headerTitle}>{title}</Text><Pressable style={s.headerRight} onPress={onNotifications}>{unread > 0 && <View style={s.unreadBadge}><Text style={s.unreadText}>{unread > 99 ? '99+' : unread}</Text></View>}<Text style={s.headerBell}>●</Text></Pressable></View>; }")
          s=s.replace("['mais','•••','Mais']","['mais','☰','Menu']")
          s=s.replace("function Agenda({ appointments, customers, onSave, onSaveTravel, onDelete }: { appointments: Appointment[]; customers: CustomerRow[];", "function Agenda({ appointments, customers, userId, onSave, onSaveTravel, onDelete }: { appointments: Appointment[]; customers: CustomerRow[]; userId?:string;")
          s=s.replace('initialTrip={editingTrip?.travel?{date:editingTrip.date,time:editingTrip.time,...editingTrip.travel}:null}', 'initialTrip={editingTrip?.travel?{date:editingTrip.date,time:editingTrip.time,...editingTrip.travel}:null} userId={userId}')
          s=s.replace("function Settings({ session, data, prefs, setPrefs, logout }:","function Settings({ session, data, prefs, setPrefs, logout }:")
          marker="  const name = nameOf(session,data);\n  const rows: Array<{title:string;sub:string;value:boolean;key:keyof Preferences}>"
          fav="  const name = nameOf(session,data);\n  const favKey=`movvant.rc11.favoriteOrigins.${session.user.id}`;\n  const [favoriteOrigins,setFavoriteOrigins]=useState<Array<{label:string,address:string}>>([{label:'Local principal',address:''},{label:'Local alternativo',address:''}]);\n  useEffect(()=>{AsyncStorage.getItem(favKey).then(raw=>{try{const x=raw?JSON.parse(raw):[];if(Array.isArray(x)&&x.length)setFavoriteOrigins([{label:'Local principal',address:''},{label:'Local alternativo',address:''}].map((d,i)=>x[i]||d))}catch{}})},[favKey]);\n  const saveFavorite=(i:number,address:string)=>{const next=favoriteOrigins.map((x,n)=>n===i?{...x,address}:x);setFavoriteOrigins(next);AsyncStorage.setItem(favKey,JSON.stringify(next));};\n  const rows: Array<{title:string;sub:string;value:boolean;key:keyof Preferences}>"
          s=s.replace(marker,fav)
          settings_insert="</View></View>{rows.map"
          fav_ui="</View></View><View style={s.aboutCard}><Text style={s.rowTitle}>Endereços favoritos de partida</Text><Text style={s.sub}>Aparecem antes da busca ao planejar uma viagem.</Text>{favoriteOrigins.map((x,i)=><View key={i} style={{marginTop:10}}><Text style={s.label}>{x.label}</Text><TextInput style={s.input} value={x.address} onChangeText={v=>saveFavorite(i,v)} placeholder=\"Digite um endereço\"/></View>)}</View>{rows.map"
          if 'Endereços favoritos de partida' not in s: s=s.replace(settings_insert,fav_ui)
          s=s.replace('<ScrollView contentContainerStyle={s.content}>','<ScrollView contentContainerStyle={s.content} keyboardShouldPersistTaps="handled" automaticallyAdjustKeyboardInsets>')
          s=s.replace('<ScrollView contentContainerStyle={s.modalList}>','<ScrollView contentContainerStyle={s.modalList} keyboardShouldPersistTaps="handled" automaticallyAdjustKeyboardInsets>')
          s=s.replace("const [period,setPeriod]=useState<'day'|'week'|'month'|'custom'>('month');","const [period,setPeriod]=useState<'day'|'week'|'month'|'custom'>('month');\n  const [activityCategory,setActivityCategory]=useState<'all'|'commercial'|'delivery'|'travel'>('all');")
          route_line="  const localTrips=local.trips.filter(x=>x.finishedAt>=start&&x.finishedAt<=end);const routeAppointments=local.appointments.filter(x=>x.type==='Viagem'&&new Date(`${x.date}T12:00:00`).getTime()>=start&&new Date(`${x.date}T12:00:00`).getTime()<=end);"
          repl="  const inPeriodAppointments=local.appointments.filter(x=>new Date(`${x.date}T12:00:00`).getTime()>=start&&new Date(`${x.date}T12:00:00`).getTime()<=end);const kind=(x:any)=>/entrega|delivery|log[ií]st/i.test(`${x.type} ${x.title}`)?'delivery':/viagem|rota/i.test(`${x.type} ${x.title}`)?'travel':'commercial';const filteredAppointments=activityCategory==='all'?inPeriodAppointments:inPeriodAppointments.filter(x=>kind(x)===activityCategory);const filteredIds=new Set(filteredAppointments.map(x=>x.id));const localTrips=local.trips.filter(x=>x.finishedAt>=start&&x.finishedAt<=end&&(activityCategory==='all'||(x.plannedTripId&&filteredIds.has(x.plannedTripId))));const routeAppointments=filteredAppointments.filter(x=>x.type==='Viagem');"
          s=s.replace(route_line,repl)
          s=s.replace("const expenseVisible=expenseRows.filter(x=>{const t=new Date(`${x.date}T12:00:00`).getTime();return t>=start&&t<=end}),expenseSummary=summarizeExpenses(expenseVisible);", "const expenseVisible=expenseRows.filter(x=>{const t=new Date(`${x.date}T12:00:00`).getTime();if(!(t>=start&&t<=end))return false;if(activityCategory==='all')return true;if(x.tripId)return filteredIds.has(x.tripId);return activityCategory==='commercial'&&x.category==='commercial'}),expenseSummary=summarizeExpenses(expenseVisible);const agendaPlanned=routeAppointments.reduce((n,x)=>n+Number(x.travel?.tollBRL||0)+(x.travel?.plannedExpenses||[]).reduce((a,e)=>a+Number(e.amount||0),0),0);")
          period_card='<View style={s.periodCard}><Text style={s.periodLabel}>PERÍODO SELECIONADO</Text>'
          chips='<View style={s.categoryTabs}>{[[\'all\',\'Todas\'],[\'commercial\',\'Visitas comerciais\'],[\'delivery\',\'Entregas\'],[\'travel\',\'Viagens\']].map(([k,l])=><Pressable key={k} style={[s.categoryTab,activityCategory===k&&s.categoryTabOn]} onPress={()=>setActivityCategory(k as any)}><Text style={[s.categoryTabText,activityCategory===k&&s.categoryTabTextOn]}>{l}</Text></Pressable>)}</View>'
          if 'Visitas comerciais' not in s: s=s.replace(period_card,chips+period_card)
          s=s.replace('<View style={s.reportLine}><Text style={s.sub}>Previsto</Text><Text style={s.reportLineValue}>{money(expenseSummary.planned)}</Text></View>', '<View style={s.reportLine}><Text style={s.sub}>Previsto na Agenda</Text><Text style={s.reportLineValue}>{money(agendaPlanned)}</Text></View><View style={s.reportLine}><Text style={s.sub}>Previsto em despesas</Text><Text style={s.reportLineValue}>{money(expenseSummary.planned)}</Text></View>')
          s=s.replace('<Header title={title} onMenu={() => setDrawer(true)} onBack={back} unread={unread}/>', '<Header title={title} onMenu={() => setDrawer(true)} onBack={back} unread={unread} onNotifications={()=>{setTab(\'mais\');setMore(\'notificacoes\')}}/>')
          s=s.replace('<Agenda appointments={appointments} customers={data?.customers||[]}', '<Agenda appointments={appointments} customers={data?.customers||[]} userId={session.user.id}')
          s=s.replace('<Bottom tab={tab} setTab={setMain}/>', '<Bottom tab={tab} setTab={(t)=>{if(t===\'mais\')setMore(\'menu\');setMain(t)}}/>')
          s=s.replace("const s = StyleSheet.create({", "const s = StyleSheet.create({\n  categoryTabs:{flexDirection:'row',flexWrap:'wrap',gap:8,marginBottom:4},categoryTab:{paddingHorizontal:12,paddingVertical:9,borderRadius:18,backgroundColor:'#E8EEF5'},categoryTabOn:{backgroundColor:NAVY},categoryTabText:{fontSize:12,fontWeight:'700',color:MUTED},categoryTabTextOn:{color:'#FFF'},")
          p.write_text(s)
          PY
      - name: Validate
        working-directory: mobile-rc11
        run: |
          npm ci
          npx expo-doctor
          npx tsc --noEmit
          npx expo config --type public >/dev/null
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mobile-rc11/src/TripPlannerScreen.tsx mobile-rc11/AppRC11Final.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'RC11: finalize route map origins profile reports and navigation'
          git push
