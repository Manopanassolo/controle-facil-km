name: Movvant Mobile Intelligence Integrate
on:
  push:
    branches: [movvant-mobile-intelligence-sync]
    paths:
      - '.github/workflows/mobile-intelligence-integrate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-intelligence-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and apply operational patches
        working-directory: mobile-rc11
        run: npm install --no-audit --no-fund
      - name: Integrate Intelligence after postinstall
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('mobile-rc11/AppRC11Final.tsx')
          s=p.read_text()
          lines=s.splitlines(); seen=set(); out=[]
          unique_prefixes=("import FuelingApprovalScreen ","import { evaluateOperationalReadiness, readinessMessage } ","import CommercialActionsScreen ")
          for line in lines:
            key=next((x for x in unique_prefixes if line.startswith(x)),None)
            if key:
              if key in seen: continue
              seen.add(key)
            out.append(line)
          s='\n'.join(out)+'\n'
          if "import CommercialActionsScreen from './src/CommercialActionsScreen';" not in s:
            s=s.replace("import { evaluateOperationalReadiness, readinessMessage } from './src/operationalReadiness';", "import { evaluateOperationalReadiness, readinessMessage } from './src/operationalReadiness';\nimport CommercialActionsScreen from './src/CommercialActionsScreen';")
          s=re.sub(r"type MorePage = [^;]+;", "type MorePage = 'menu' | 'lojas' | 'inteligencia' | 'relatorios' | 'despesas' | 'abastecimentos' | 'veiculos' | 'notificacoes' | 'sincronizacao' | 'configuracoes';", s, count=1)
          # Remove any incomplete callback experiment and retain stable screen integration.
          s=s.replace(" data={data} onSchedule={onScheduleCommercial}/>", " data={data}/>")
          s=s.replace("; onScheduleCommercial?:(customerId:string,customerName:string)=>void", "")
          s=re.sub(r" onScheduleCommercial=\{\(customerId,customerName\)=>\{setMain\('agenda'\);Alert\.alert\('Oportunidade comercial',[^}]+\}\}", "", s)
          if "if (page === 'inteligencia')" not in s:
            s=s.replace("if (page === 'relatorios') return <ReportsHierarchicalScreen session={session} data={data} local={local}/>;", "if (page === 'inteligencia') return <CommercialActionsScreen session={session} data={data}/>;\n  if (page === 'relatorios') return <ReportsHierarchicalScreen session={session} data={data} local={local}/>;")
          if 'title="Inteligência Comercial"' not in s:
            s=s.replace("<Row icon=\"▦\" title=\"Lojas\"", "<Row icon=\"✦\" title=\"Inteligência Comercial\" sub=\"Prioridades reais, risco, mix e próxima ação\" onPress={() => setPage('inteligencia')}/><Row icon=\"▦\" title=\"Lojas\"")
          if "['✦','Inteligência Comercial'" not in s:
            s=s.replace("['▦','Lojas',()=>go('mais','lojas')]", "['✦','Inteligência Comercial',()=>go('mais','inteligencia')],['▦','Lojas',()=>go('mais','lojas')]")
          p.write_text(s)
          PY
      - name: Validate integration
        run: |
          grep -q "CommercialActionsScreen" mobile-rc11/AppRC11Final.tsx
          grep -q "Inteligência Comercial" mobile-rc11/AppRC11Final.tsx
          grep -q "abastecimentos" mobile-rc11/AppRC11Final.tsx
      - name: Typecheck
        working-directory: mobile-rc11
        run: npx tsc --noEmit
      - name: Commit integrated app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-rc11/AppRC11Final.tsx
          git diff --cached --quiet || git commit -m "Mobile: integrar Inteligência Comercial estável"
          git push origin HEAD:movvant-mobile-intelligence-sync
