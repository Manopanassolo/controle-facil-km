name: RC11.7 outbound alternatives v4
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-map-v3.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: movvant-mobile-rc11
      - name: Patch canonical strategies and clickable route markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/src/TripPlannerScreen.tsx')
          s=p.read_text()
          s=s.replace("for(const strategy of ['fastest','avoid_tolls','avoid_highways'])", "for(const strategy of ['rapida','economica','urbana'])")
          s=s.replace("strategy==='fastest'?'Mais rápida':strategy==='avoid_tolls'?'Menos pedágios':'Evitar rodovias'", "strategy==='rapida'?'Mais rápida':strategy==='economica'?'Menos pedágios':'Evitar rodovias'")
          s=s.replace("if(items.length<2){const variants:RouteOption[]=[];", "if(items.length<3){const variants:RouteOption[]=[];")
          old='''{routes.map((r,i)=>{const pts=decodePolyline(r.polyline);return pts.length>1&&i!==selected?<Polyline key={`alt-${i}`} coordinates={pts} strokeColor="#8B9AAA" strokeWidth={5} zIndex={3}/>:null})}{routePoints.length>1?<Polyline key={`selected-out-${selected}`} coordinates={routePoints} strokeColor={BLUE} strokeWidth={9} zIndex={20}/>:null}'''
          new='''{routes.map((r,i)=>{const pts=decodePolyline(r.polyline);return pts.length>1&&i!==selected?<Polyline key={`alt-${i}`} coordinates={pts} strokeColor="#8B9AAA" strokeWidth={5} zIndex={3}/>:null})}{routes.map((r,i)=>{const pts=decodePolyline(r.polyline);if(pts.length<2)return null;const fractions=[0.32,0.50,0.68],idx=Math.min(pts.length-1,Math.max(0,Math.round((fractions[i%fractions.length]||0.5)*(pts.length-1))));return <Marker key={`route-pick-${i}`} coordinate={pts[idx]} anchor={{x:.5,y:.5}} onPress={()=>selectRoute(i)} zIndex={40}><View style={{minWidth:34,height:34,borderRadius:17,alignItems:'center',justifyContent:'center',backgroundColor:i===selected?BLUE:'#FFFFFF',borderWidth:2,borderColor:i===selected?'#FFFFFF':'#536577'}}><Text style={{fontSize:12,fontWeight:'900',color:i===selected?'#FFFFFF':'#17324D'}}>{i+1}</Text></View></Marker>})}{routePoints.length>1?<Polyline key={`selected-out-${selected}`} coordinates={routePoints} strokeColor={BLUE} strokeWidth={9} zIndex={20}/>:null}'''
          if old not in s: raise SystemExit('map alternatives block not found')
          s=s.replace(old,new)
          s=s.replace('Toque diretamente sobre qualquer linha. A rota selecionada fica azul; o retorno fica laranja.','Toque na linha ou nos marcadores 1, 2 e 3 para escolher a rota de ida. A selecionada fica azul; o retorno correspondente fica laranja.')
          p.write_text(s)
          PY
      - name: Commit RC11.7 map fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-rc11/src/TripPlannerScreen.tsx
          git commit -m 'RC11.7: separate outbound alternatives and add map selectors'
          git push origin HEAD:movvant-mobile-rc11
