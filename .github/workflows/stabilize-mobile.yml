name: Movvant mobile-web alignment gate
on:
  push:
    branches: [movvant-mobile-web-alignment]
  pull_request:
    branches: [movvant-enterprise-web-full-transplant]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: movvant-v2/package-lock.json
      - name: Install Movvant V2 dependencies
        working-directory: movvant-v2
        run: npm ci
      - name: Build Movvant V2 production candidate
        working-directory: movvant-v2
        run: npm run build
      - name: Start Movvant V2 preview server
        working-directory: movvant-v2
        run: |
          npm run start -- -H 127.0.0.1 -p 4177 > /tmp/movvant-v2-server.log 2>&1 &
          echo $! > /tmp/movvant-v2-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4177/roteiros >/tmp/movvant-v2-routes.html; then exit 0; fi
            sleep 1
          done
          cat /tmp/movvant-v2-server.log
          exit 1
      - name: Verify Movvant V2 identity
        run: |
          grep -qi 'Movvant' /tmp/movvant-v2-routes.html
          ! grep -Eqi 'Controle Fácil KM|Controle KM' /tmp/movvant-v2-routes.html
      - name: Install browser for visual validation
        working-directory: movvant-v2
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture real Rotas visual references
        working-directory: movvant-v2
        run: node scripts/capture-routes-preview.mjs
      - name: Upload Rotas visual references
        uses: actions/upload-artifact@v4
        with:
          name: movvant-v2-routes-preview
          path: /tmp/movvant-v2-routes-*.png
          retention-days: 7
      - name: Upload Movvant V2 server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movvant-v2-preview-log
          path: /tmp/movvant-v2-server.log
          retention-days: 7
