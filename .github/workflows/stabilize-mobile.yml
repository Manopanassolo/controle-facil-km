name: Movvant mobile-web alignment gate
on:
  push:
    branches: [movvant-mobile-web-alignment]
  pull_request:
    branches: [movvant-enterprise-web-full-transplant]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Worker syntax
        run: node --check cloudflare-worker.js
      - name: Build production candidate
        run: npm run build
      - name: Verify Movvant identity
        run: |
          grep -Eqi '<title>[^<]*Movvant' dist/index.html
          ! grep -Eqi '<title>[^<]*(Controle Fácil KM|Controle KM)' dist/index.html
          ! grep -Eqi '>(Controle Fácil KM|Controle KM)<' dist/index.html
      - name: Inspect rendered shell
        run: node inspect-shell.js
      - name: Export Movvant canonical HTML snapshot
        uses: actions/upload-artifact@v4
        with:
          name: movvant-mobile-web-alignment-html
          path: dist/index.html
          retention-days: 7
      - name: Capture desktop visual reference
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node preview-desktop-screens.mjs
      - name: Upload visual reference
        uses: actions/upload-artifact@v4
        with:
          name: movvant-web-reference-preview
          path: /tmp/movvant-preview-*.png
          retention-days: 7
