name: Controle KM quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and validate production candidate
        run: npm run build
      - name: Inspect rendered shell
        run: node inspect-shell.js
      - name: Install browser for visual and all-screen audit
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture desktop visual preview
        if: github.event_name == 'pull_request'
        run: node preview-desktop-screens.mjs
      - name: Audit 100 percent of rendered screens
        if: github.event_name == 'pull_request'
        run: node all-screens-audit.mjs
      - name: Upload visual and all-screen evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: movvant-v16346-full-screen-audit
          path: |
            /tmp/movvant-preview-*.png
            /tmp/movvant-audit-*.png
            /tmp/movvant-all-screens-audit.json
