name: RC11 run agenda management patch
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-run-agenda-management-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply agenda management patch
        run: python3 mobile-rc11/scripts/apply_agenda_management.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile-rc11/AppRC11Final.tsx
          git commit -m 'RC11: evolve agenda and management vision'
          git push