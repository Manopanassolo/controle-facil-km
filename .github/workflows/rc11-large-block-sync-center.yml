name: RC11 large block sync center
on:
  push:
    branches: [movvant-mobile-rc11]
    paths: ['.github/workflows/rc11-large-block-sync-center.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sync center block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile-rc11/AppRC11Final.tsx')
          s=p.read_text()
          s=s.replace("import { LocalAppointment, LocalKmRecord, LocalState, enqueue, enqueueReplacingLocal, readLocalState, readQueue, removeAppointmentLocal, removeQueuedForLocal, saveAppointmentLocal, saveKmLocal, syncPending } from './src/offline';", "import { LocalAppointment, LocalKmRecord, LocalState, SyncDiagnostics, SyncReport, enqueue, enqueueReplacingLocal, readLastSyncReport, readLocalState, readQueue, readSyncDiagnostics, removeAppointmentLocal, removeQueuedForLocal, saveAppointmentLocal, saveKmLocal, syncPending } from './src/offline';")
          old="function SyncPage({ online, pending, lastLoaded, errors, syncing, onSync, onRefresh }: { online: boolean; pending: number; lastLoaded?: string; errors: string[]; syncing: boolean; onSync: () => Promise<void>; onRefresh: () => Promise<void> }) {\n  return <ScrollView contentContainerStyle={s.content}><View style={s.syncHero}><View style={[s.syncBig,!online&&{backgroundColor:'#FFF3E5'}]}><Text style={[s.syncBigText,!online&&{color:ORANGE}]}>{online?'✓':'!'}</Text></View><Text style={s.syncHeroTitle}>{online?'Conexão disponível':'Modo offline ativo'}</Text><Text style={s.syncHeroText}>{pending ? `${pending} alteração(ões) estão protegidas na fila local.` : 'Não há alterações locais pendentes.'}</Text></View>"
          new="function SyncPage({ online, pending, lastLoaded, errors, syncing, diagnostics, report, onSync, onRefresh }: { online: boolean; pending: number; lastLoaded?: string; errors: string[]; syncing: boolean; diagnostics: SyncDiagnostics; report: SyncReport | null; onSync: () => Promise<void>; onRefresh: () => Promise<void> }) {\n  const rows:Array<[string,number,string]>=[['Visitas',diagnostics.visit,'Check-in e check-out'],['KM',diagnostics.km,'Odômetro e comprovantes'],['Rotas',diagnostics.trip,'Deslocamentos e GPS'],['Agenda',diagnostics.appointment,'Compromissos locais']];\n  return <ScrollView contentContainerStyle={s.content}><View style={s.syncHero}><View style={[s.syncBig,!online&&{backgroundColor:'#FFF3E5'}]}><Text style={[s.syncBigText,!online&&{color:ORANGE}]}>{online?'✓':'!'}</Text></View><Text style={s.syncHeroTitle}>{online?'Central de sincronização':'Modo offline ativo'}</Text><Text style={s.syncHeroText}>{pending ? `${pending} alteração(ões) protegidas no aparelho e aguardando confirmação do servidor.` : 'Não há alterações locais pendentes.'}</Text></View><View style={s.syncGrid}>{rows.map(([label,value,sub])=><View key={label} style={s.syncDiagCard}><Text style={s.syncDiagValue}>{value}</Text><Text style={s.rowTitle}>{label}</Text><Text style={s.sub}>{sub}</Text></View>)}</View>{report&&<View style={s.reportWide}><Text style={s.rowTitle}>Última tentativa</Text><Text style={s.sub}>{new Date(report.attemptedAt).toLocaleString('pt-BR')} · {report.sent} enviado(s) · {report.pending} pendente(s)</Text>{report.issues.slice(0,4).map((i,idx)=><View key={`${i.entity}-${idx}`} style={s.syncIssue}><Text style={s.warningTitle}>{i.entity.toUpperCase()}</Text><Text style={s.warningText}>{i.message}</Text></View>)}</View>}"
          if old not in s: raise SystemExit('SyncPage anchor not found')
          s=s.replace(old,new,1)
          s=s.replace("if (page === 'sincronizacao') return <SyncPage online={online} pending={pending} lastLoaded={data?.loadedAt} errors={data?.errors || []} syncing={syncing} onSync={onSync} onRefresh={onRefresh}/>;", "if (page === 'sincronizacao') return <SyncPage online={online} pending={pending} lastLoaded={data?.loadedAt} errors={data?.errors || []} syncing={syncing} diagnostics={diagnostics} report={syncReport} onSync={onSync} onRefresh={onRefresh}/>;")
          s=s.replace("function More({ page, setPage, data, local, session, prefs, setPrefs, online, pending, syncing, onSync, onRefresh, onRead, logout }: { page: MorePage; setPage: (p: MorePage) => void; data: BootstrapData | null; local: LocalState; session: Session; prefs: Preferences; setPrefs: (p: Preferences) => void; online: boolean; pending: number; syncing: boolean; onSync: () => Promise<void>; onRefresh: () => Promise<void>; onRead: (id: string) => Promise<void>; logout: () => void }) {", "function More({ page, setPage, data, local, session, prefs, setPrefs, online, pending, syncing, diagnostics, syncReport, onSync, onRefresh, onRead, logout }: { page: MorePage; setPage: (p: MorePage) => void; data: BootstrapData | null; local: LocalState; session: Session; prefs: Preferences; setPrefs: (p: Preferences) => void; online: boolean; pending: number; syncing: boolean; diagnostics: SyncDiagnostics; syncReport: SyncReport | null; onSync: () => Promise<void>; onRefresh: () => Promise<void>; onRead: (id: string) => Promise<void>; logout: () => void }) {")
          s=s.replace("['↗','Relatórios',()=>go('mais','relatorios')],['●','Notificações'", "['↗','Relatórios',()=>go('mais','relatorios')],['↻','Sincronização',()=>go('mais','sincronizacao')],['●','Notificações'")
          oldstate="const [session,setSession] = useState<Session|null>(null); const [boot,setBoot] = useState(true); const [data,setData] = useState<BootstrapData|null>(null); const [local,setLocal] = useState<LocalState>({ appointments:[],km:[],trips:[],visits:[] }); const [online,setOnline] = useState(true); const [pending,setPending] = useState(0); const [syncing,setSyncing] = useState(false); const [prefs,setPrefs] = useState<Preferences>(DEFAULT_PREFS);"
          newstate="const [session,setSession] = useState<Session|null>(null); const [boot,setBoot] = useState(true); const [data,setData] = useState<BootstrapData|null>(null); const [local,setLocal] = useState<LocalState>({ appointments:[],km:[],trips:[],visits:[] }); const [online,setOnline] = useState(true); const [pending,setPending] = useState(0); const [syncing,setSyncing] = useState(false); const [prefs,setPrefs] = useState<Preferences>(DEFAULT_PREFS); const [enterpriseSettings,setEnterpriseSettings] = useState<EnterpriseSettings>(DEFAULT_ENTERPRISE_SETTINGS); const [diagnostics,setDiagnostics] = useState<SyncDiagnostics>({total:0,appointment:0,km:0,trip:0,visit:0,localOnlyAppointments:0}); const [syncReport,setSyncReport] = useState<SyncReport|null>(null);"
          if oldstate not in s: raise SystemExit('state anchor not found')
          s=s.replace(oldstate,newstate,1)
          s=s.replace("const reloadLocal = useCallback(async () => { setLocal(await readLocalState()); setPending((await readQueue()).length); }, []);", "const reloadLocal = useCallback(async () => { const [l,q,d,r]=await Promise.all([readLocalState(),readQueue(),readSyncDiagnostics(),readLastSyncReport()]); setLocal(l); setPending(q.length); setDiagnostics(d); setSyncReport(r); }, []);")
          marker="useEffect(() => NetInfo.addEventListener(state => setOnline(Boolean(state.isConnected))), []);"
          s=s.replace(marker, marker+"\n  useEffect(() => { readEnterpriseSettings(data?.companyId).then(setEnterpriseSettings).catch(()=>setEnterpriseSettings(DEFAULT_ENTERPRISE_SETTINGS)); }, [data?.companyId]);")
          s=s.replace("if (!online || !prefs.autoSync || !session || !data?.companyId || pending <= 0 || syncing) return; const now = Date.now(); if (now - lastAutoSyncAttempt.current < 15000) return;", "if (!online || !prefs.autoSync || !enterpriseSettings.sync.autoSync || !session || !data?.companyId || pending <= 0 || syncing) return; const now = Date.now(); if (now - lastAutoSyncAttempt.current < Math.max(5000,enterpriseSettings.sync.retrySeconds*1000)) return;")
          s=s.replace("}, [online,prefs.autoSync,session,data?.companyId,pending,syncing,sync]);", "}, [online,prefs.autoSync,enterpriseSettings.sync.autoSync,enterpriseSettings.sync.retrySeconds,session,data?.companyId,pending,syncing,sync]);")
          s=s.replace("<Home session={session} data={data} local={local} appointments={appointments} online={online} pending={pending} goAgenda={()=>setMain('agenda')} goMap={()=>setMain('mapa')}/>", "<Home session={session} data={data} local={local} appointments={appointments} online={online} pending={pending} goAgenda={()=>setMain('agenda')} goMap={()=>setMain('mapa')}/>")
          s=s.replace("online={online} pending={pending} syncing={syncing} onSync={sync}", "online={online} pending={pending} syncing={syncing} diagnostics={diagnostics} syncReport={syncReport} onSync={sync}")
          s=s.replace("syncHero:{alignItems:'center',paddingVertical:18},", "syncHero:{alignItems:'center',paddingVertical:18},syncGrid:{flexDirection:'row',flexWrap:'wrap',gap:10},syncDiagCard:{width:'48%',minHeight:100,backgroundColor:'#fff',borderRadius:18,borderWidth:1,borderColor:BORDER,padding:14},syncDiagValue:{fontSize:22,fontWeight:'900',color:NAVY},syncIssue:{marginTop:9,paddingTop:9,borderTopWidth:1,borderTopColor:'#F0E1BE'},")
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile-rc11/AppRC11Final.tsx
          git commit -m 'RC11: add sync center diagnostics and enterprise retry rules'
          git push
