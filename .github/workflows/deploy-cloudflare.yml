name: Movvant Cloudflare deploy
on:
  workflow_run:
    workflows: ["Controle KM quality gate"]
    types: [completed]
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      MOVVANT_URL: https://movvant.panassolofilho.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build validated candidate
        run: npm run build
      - name: Require Google Maps key
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo 'GOOGLE_MAPS_API_KEY repository secret is required for Places and Routes.'
            exit 1
          fi
      - name: Provision Google Maps key
        run: printf '%s' "$GOOGLE_MAPS_API_KEY" | npx --yes wrangler@4 secret put GOOGLE_MAPS_API_KEY
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
      - name: Verify live HTML is not blank
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 20 "$MOVVANT_URL/" -o /tmp/movvant.html; then break; fi
            sleep 3
          done
          test -s /tmp/movvant.html
          grep -q 'mvStartupGuardV16231' /tmp/movvant.html
          grep -q 'v162.44' /tmp/movvant.html
          grep -q 'Movvant' /tmp/movvant.html
          echo "Live HTML bytes: $(wc -c < /tmp/movvant.html)"
      - name: Verify Google Maps worker binding
        run: |
          curl -fsS --max-time 20 "$MOVVANT_URL/api/maps-health" -o /tmp/maps-health.json
          cat /tmp/maps-health.json
          grep -q '"configured":true' /tmp/maps-health.json
      - name: Verify unauthenticated browser startup
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --window-size=390,844 --dump-dom "$MOVVANT_URL/" > /tmp/movvant-dom.html 2>/tmp/chrome.err || { cat /tmp/chrome.err; exit 1; }
          test -s /tmp/movvant-dom.html
          if grep -q 'id="mvStartupRecoveryV16231"' /tmp/movvant-dom.html; then
            echo 'Blank-screen recovery panel appeared in live browser.'
            exit 1
          fi
          grep -Eq 'id="auth"|id="app"' /tmp/movvant-dom.html
      - name: Verify authenticated Android critical actions
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4500 --window-size=390,844 --user-agent='Mozilla/5.0 (Linux; Android 16; SM-S948B) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' --dump-dom "$MOVVANT_URL/?mv_shell_test=1" > /tmp/movvant-mobile-dom.html 2>/tmp/chrome-mobile.err || { cat /tmp/chrome-mobile.err; exit 1; }
          test -s /tmp/movvant-mobile-dom.html
          grep -q 'data-mv-shell-test="pass"' /tmp/movvant-mobile-dom.html
          grep -q 'data-mv-buttons-test="pass"' /tmp/movvant-mobile-dom.html
          grep -q 'data-mv-trip-test="pass"' /tmp/movvant-mobile-dom.html
          grep -q 'data-mv-bell-test="pass"' /tmp/movvant-mobile-dom.html
          grep -q 'data-mv-agenda-test="pass"' /tmp/movvant-mobile-dom.html
          echo 'Authenticated Android trip + notifications + agenda actions: PASS'
      - name: Verify trip content remains visible
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=4600 --window-size=390,844 --user-agent='Mozilla/5.0 (Linux; Android 16; SM-S948B) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' --dump-dom "$MOVVANT_URL/?mv_trip_stable_test=1" > /tmp/movvant-trip-stable.html 2>/tmp/chrome-trip-stable.err || { cat /tmp/chrome-trip-stable.err; exit 1; }
          grep -q 'data-mv-trip-stable-test="pass"' /tmp/movvant-trip-stable.html
          echo 'Novo deslocamento content remains visible after 3.8 seconds: PASS'
