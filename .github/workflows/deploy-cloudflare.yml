name: Movvant Cloudflare deploy
on:
  workflow_run:
    workflows: ["Controle KM quality gate"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: movvant-cloudflare-production
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      MOVVANT_URL: https://movvant.panassolofilho.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build validated candidate
        run: npm run build
      - name: Require Google Maps key
        run: test -n "$GOOGLE_MAPS_API_KEY"
      - name: Provision Google Maps key
        run: printf '%s' "$GOOGLE_MAPS_API_KEY" | npx --yes wrangler@4 secret put GOOGLE_MAPS_API_KEY
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
      - name: Verify exact live build
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$MOVVANT_URL/" -o /tmp/movvant.html; then break; fi
            sleep 3
          done
          test -s /tmp/movvant.html
          grep -q 'v162.61' /tmp/movvant.html
          grep -q 'Movvant' /tmp/movvant.html
          echo "Cloudflare live build 162.61 confirmed; bytes: $(wc -c < /tmp/movvant.html)"
      - name: Prepare visual browser
        timeout-minutes: 3
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Android visual and real typing test
        timeout-minutes: 2
        run: |
          node cloudflare-visual-test.mjs
          test -s /tmp/movvant-android.png
          test -s /tmp/movvant-visual-result.json
          grep -q '"pass": true' /tmp/movvant-visual-result.json
          cat /tmp/movvant-visual-result.json
      - name: Upload Android visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movvant-cloudflare-android-visual
          path: |
            /tmp/movvant-android.png
            /tmp/movvant-android-failure.png
            /tmp/movvant-pretap.png
            /tmp/movvant-visual-result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Google Maps worker binding
        if: success()
        run: |
          curl -fsS --max-time 20 "$MOVVANT_URL/api/maps-health" -o /tmp/maps-health.json
          cat /tmp/maps-health.json
          grep -q '"configured":true' /tmp/maps-health.json
      - name: Verify Places endpoint returns suggestions
        if: success()
        run: |
          code=$(curl -sS --max-time 20 -w '%{http_code}' "$MOVVANT_URL/api/places?q=Avenida%20Paulista" -o /tmp/places.json)
          echo "Places HTTP: $code"
          cat /tmp/places.json
          test "$code" = "200"
          grep -q '"items":\[' /tmp/places.json
          grep -q '"placeId"' /tmp/places.json
