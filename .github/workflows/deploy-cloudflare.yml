name: Movvant Cloudflare deploy
on:
  workflow_run:
    workflows: ["Controle KM quality gate"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: movvant-cloudflare-production
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      MOVVANT_URL: https://movvant.panassolofilho.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build validated candidate
        run: npm run build
      - name: Require Google Maps key
        run: |
          test -n "$GOOGLE_MAPS_API_KEY"
      - name: Provision Google Maps key
        run: printf '%s' "$GOOGLE_MAPS_API_KEY" | npx --yes wrangler@4 secret put GOOGLE_MAPS_API_KEY
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
      - name: Verify exact live build
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 20 "$MOVVANT_URL/" -o /tmp/movvant.html; then break; fi
            sleep 3
          done
          test -s /tmp/movvant.html
          grep -q 'v162.59' /tmp/movvant.html
          grep -q 'Movvant' /tmp/movvant.html
          echo "Cloudflare live build 162.59 confirmed; bytes: $(wc -c < /tmp/movvant.html)"
      - name: Android visual and typing test
        timeout-minutes: 2
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          UA='Mozilla/5.0 (Linux; Android 16; SM-S948B) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'
          set +e
          timeout 30s "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=390,844 --user-agent="$UA" --dump-dom "$MOVVANT_URL/?mv_visual_test=1" > /tmp/movvant-visual-dom.html 2>/tmp/chrome-visual.err
          DOM_RC=$?
          set -e
          if [ "$DOM_RC" -ne 0 ] && [ "$DOM_RC" -ne 124 ]; then cat /tmp/chrome-visual.err; exit "$DOM_RC"; fi
          test -s /tmp/movvant-visual-dom.html
          grep -q 'data-mv-build="162.59"' /tmp/movvant-visual-dom.html
          grep -q 'data-mv-typing-test="pass"' /tmp/movvant-visual-dom.html
          set +e
          timeout 30s "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6500 --window-size=390,844 --user-agent="$UA" --screenshot=/tmp/movvant-android.png "$MOVVANT_URL/?mv_visual_test=1" >/tmp/chrome-shot.out 2>/tmp/chrome-shot.err
          SHOT_RC=$?
          set -e
          if [ "$SHOT_RC" -ne 0 ] && [ "$SHOT_RC" -ne 124 ]; then cat /tmp/chrome-shot.err; exit "$SHOT_RC"; fi
          test -s /tmp/movvant-android.png
          echo 'Cloudflare Android visual/typing test: PASS'
      - name: Upload Android visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: movvant-cloudflare-android-visual
          path: |
            /tmp/movvant-android.png
            /tmp/movvant-visual-dom.html
          retention-days: 7
      - name: Verify Google Maps worker binding
        run: |
          curl -fsS --max-time 20 "$MOVVANT_URL/api/maps-health" -o /tmp/maps-health.json
          cat /tmp/maps-health.json
          grep -q '"configured":true' /tmp/maps-health.json
      - name: Verify Places endpoint returns suggestions
        run: |
          code=$(curl -sS --max-time 20 -w '%{http_code}' "$MOVVANT_URL/api/places?q=Avenida%20Paulista" -o /tmp/places.json)
          echo "Places HTTP: $code"
          cat /tmp/places.json
          test "$code" = "200"
          grep -q '"items":\[' /tmp/places.json
          grep -q '"placeId"' /tmp/places.json
