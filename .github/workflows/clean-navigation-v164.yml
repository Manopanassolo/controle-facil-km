# canonical navigation cleanup retry after validator migration
name: Clean Movvant navigation v164
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-navigation-v164.yml'
permissions:
  contents: write
jobs:
  clean-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Remove obsolete embedded navigation generations
        run: |
          node - <<'EOF'
          const fs=require('fs');
          let s=fs.readFileSync('index.html','utf8');
          function cut(a,b,label){
            const i=s.indexOf(a),j=s.indexOf(b,i+a.length);
            if(i<0||j<0)throw new Error('cleanup marker missing: '+label);
            s=s.slice(0,i)+s.slice(j);
          }
          cut('// v162.9 clean mobile menu built on top of the stable shell only','// v162.11 Maps/rotas readiness','v162.9/10 mobile menu JS');
          cut('/* v162.9 clean isolated menu */','/* v162.14 mobile place picker */','v162.9/10 mobile menu CSS');
          cut('// v162.82 performance hotfix: persistent navigation without continuous DOM observation.','// v162.83: carry the selected plan into the active trip and simplify the execution screen.','v162.82 navigation JS');
          cut('/* v162.82 persistent navigation shell */','/* v162.83 focused active route screen */','v162.82 navigation CSS');
          const v53needle="const valid=new Set(['inicio','viagem','historico','agenda','rotas','veiculos','custos','equipe','relatorios','ajuda','perfil','painel','notificacoes','auditoria','backup','config']);";
          const p=s.indexOf(v53needle);if(p<0)throw new Error('v162.53 navigation block missing');
          const a=s.lastIndexOf('(function(){',p),b=s.indexOf('// v162.54:',p);if(a<0||b<0)throw new Error('v162.53 boundaries missing');
          s=s.slice(0,a)+s.slice(b);
          s=s.replaceAll('mvNavigationV16282','mvNavigationV164');
          const marker='// v163.54: authoritative mobile dock + operational dashboard. Older handlers must not own these surfaces.';
          const mi=s.indexOf(marker);if(mi<0)throw new Error('v163.54 marker missing');
          const nav=`// v164.0: single canonical navigation authority.\n(function(){\n const byId=id=>document.getElementById(id);\n const labels={inicio:'Início',viagem:'Novo percurso',historico:'Histórico',agenda:'Agenda',rotas:'Rotas',veiculos:'Veículos',custos:'Custos',equipe:'Equipe',relatorios:'Relatórios',ajuda:'Ajuda',perfil:'Meu perfil',painel:'Painel ADM',notificacoes:'Avisos',auditoria:'Auditoria',backup:'Backup',config:'Configurações'};\n const order=Object.keys(labels);let current='inicio';\n const valid=p=>order.includes(p)&&!!byId('p-'+p);\n function renderActive(p){document.querySelectorAll('[data-mvroute],[data-mv-dock],[data-page164]').forEach(b=>{const x=b.dataset.mvroute||b.dataset.mvDock||b.dataset.page164;b.classList.toggle('active',x===p);if(x===p)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}\n function showPage(p,{historyMode='push'}={}){if(!valid(p))p='inicio';document.querySelectorAll('#app [id^="p-"]').forEach(el=>{el.classList.add('hide');el.setAttribute('aria-hidden','true');el.style.removeProperty('display')});const t=byId('p-'+p);t.classList.remove('hide');t.setAttribute('aria-hidden','false');current=p;document.body.dataset.mvPage=p;document.body.dataset.mvNavAuthority='164.0';try{localStorage.setItem('mv_last_page_v164',p)}catch(_){};try{const u=new URL(location.href);u.hash='p='+encodeURIComponent(p);history[historyMode==='replace'?'replaceState':'pushState']({...(history.state||{}),mvPage:p,mvVersion:'164.0'},'',u.pathname+u.search+u.hash)}catch(_){};renderActive(p);closeMenu();window.scrollTo(0,0);return true}\n function navigate(p){if(p===current){closeMenu();return true}return showPage(p)}\n function menu(){let ov=byId('mvMenu164');if(ov)return ov;ov=document.createElement('div');ov.id='mvMenu164';ov.innerHTML='<div class="mv-menu164-shade" data-close164></div><aside class="mv-menu164-panel" aria-label="Menu principal"><div class="mv-menu164-head"><div><b>Movvant</b><small>Inteligência comercial em campo</small></div><button type="button" data-close164 aria-label="Fechar">×</button></div><div class="mv-menu164-items">'+order.map(p=>'<button type="button" data-page164="'+p+'">'+labels[p]+'</button>').join('')+'<button type="button" data-logout164>Sair</button></div></aside>';document.body.appendChild(ov);ov.addEventListener('click',e=>{const p=e.target.closest?.('[data-page164]')?.dataset.page164;if(p){e.preventDefault();e.stopImmediatePropagation();navigate(p);return}if(e.target.closest?.('[data-close164]')){e.preventDefault();closeMenu();return}if(e.target.closest?.('[data-logout164]')){e.preventDefault();closeMenu();byId('sair')?.click()}} ,true);return ov}\n function openMenu(){const ov=menu();ov.classList.add('open');document.body.classList.add('mv-menu164-open')}\n function closeMenu(){byId('mvMenu164')?.classList.remove('open');document.body.classList.remove('mv-menu164-open')}\n function initial(){let p='';try{p=new URL(location.href).hash.match(/(?:^#|[&#])p=([^&]+)/)?.[1]||'';p=decodeURIComponent(p)}catch(_){};if(!valid(p))try{p=localStorage.getItem('mv_last_page_v164')||''}catch(_){};return valid(p)?p:'inicio'}\n document.addEventListener('click',e=>{const r=e.target.closest?.('[data-mvroute]');if(r&&valid(r.dataset.mvroute)){e.preventDefault();e.stopImmediatePropagation();navigate(r.dataset.mvroute);return}const j=e.target.closest?.('[data-p-jump]');if(j&&valid(j.dataset.pJump)){e.preventDefault();e.stopImmediatePropagation();navigate(j.dataset.pJump)}},true);\n addEventListener('popstate',e=>{const p=e.state?.mvPage;if(valid(p))showPage(p,{historyMode:'replace'})});\n addEventListener('hashchange',()=>{try{const m=location.hash.match(/(?:^#|[&#])p=([^&]+)/),p=m?decodeURIComponent(m[1]):'';if(valid(p)&&p!==current)showPage(p,{historyMode:'replace'})}catch(_){}});\n function boot(){menu();const old=document.querySelector('#app>.nav');if(old){old.hidden=true;old.setAttribute('aria-hidden','true');old.style.setProperty('display','none','important')}if(byId('app')&&!byId('app').classList.contains('hide'))showPage(initial(),{historyMode:'replace'})}\n [0,120,450,1000].forEach(ms=>setTimeout(boot,ms));globalThis.mvNavigationV164={navigate,openMenu,closeMenu,showPage,get page(){return current}};\n})();\n`;
          s=s.slice(0,mi)+nav+s.slice(mi);
          const css=`\n/* v164 canonical navigation */\n#app>.nav{display:none!important;visibility:hidden!important;pointer-events:none!important}\n#mvMenu164{display:none;position:fixed;inset:0;z-index:2147483647}#mvMenu164.open{display:block}.mv-menu164-shade{position:absolute;inset:0;background:rgba(4,19,38,.58)}.mv-menu164-panel{position:absolute;left:0;top:0;bottom:0;width:min(86vw,330px);background:#082b50;padding:14px;overflow:auto;box-shadow:16px 0 40px rgba(0,0,0,.28)}.mv-menu164-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 12px;border-bottom:1px solid #285179;margin-bottom:10px}.mv-menu164-head b{display:block;color:#fff;font-size:18px}.mv-menu164-head small{display:block;color:#c8ff00;font-size:9px;margin-top:2px}.mv-menu164-head button{width:38px!important;height:38px!important;min-height:38px!important;padding:0!important;background:#123f73!important;color:#c8ff00!important;border:1px solid #2c5b8c!important}.mv-menu164-items{display:grid;gap:6px}.mv-menu164-items button{width:100%!important;min-height:42px!important;padding:9px 11px!important;text-align:left!important;border:1px solid #2a578e!important;border-radius:8px!important;background:#123f73!important;color:#c8ff00!important;font-size:11px!important}.mv-menu164-items button.active{background:#087be2!important;color:#fff!important;border-color:#c8ff00!important}.mv-menu164-items [data-logout164]{margin-top:8px;background:#f4f7fb!important;color:#173a5c!important;border-color:#d7e0ea!important}.mv-menu164-open{overflow:hidden!important}\n`;
          const si=s.indexOf('</style>');if(si<0)throw new Error('style close missing');s=s.slice(0,si)+css+s.slice(si);
          fs.writeFileSync('index.html',s);
          EOF
          node build.js
          node validate-core-flow.js
          node validate-navigation.js
          node validate-build.js
          grep -q 'mvNavigationV164' index.html
          ! grep -q 'v162.82 performance hotfix' index.html
          ! grep -q 'v162.9 clean mobile menu built' index.html
          ! grep -q "const valid=new Set(\['inicio','viagem','historico','agenda'" index.html
      - name: Update shell test to current menu
        run: |
          node - <<'EOF'
          const fs=require('fs');let s=fs.readFileSync('cloudflare-shell-real-click-test.mjs','utf8');
          s=s.replace("document.body.classList.contains('mv-menu-open-v16282')","document.getElementById('mvMenu164')?.classList.contains('open')===true");
          s=s.replace("#app>.nav [data-p=\"agenda\"]","#mvMenu164 [data-page164=\"agenda\"]");
          fs.writeFileSync('cloudflare-shell-real-click-test.mjs',s);
          EOF
          rm -f .github/workflows/clean-navigation-v164.yml
      - name: Commit clean navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace legacy navigation generations with canonical v164 controller'
          git push
